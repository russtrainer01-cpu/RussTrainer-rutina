<script>
let audioCtx = null;
function ensureAudioContext(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  return audioCtx;
}

function parseDescansoSeconds(str){
  if(!str) return 60;
  const m = String(str).match(/(\d+(\.\d+)?)/);
  if(!m) return 60;
  const num = parseFloat(m[1]);
  if(/min/i.test(str)) return Math.round(num*60);
  return Math.round(num);
}
function formatMMSS(s){
  const mi = Math.floor(s/60);
  const se = s % 60;
  return `${mi}:${String(se).padStart(2,'0')}`;
}
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){
    try{ wakeLock.release(); }catch(e){}
    wakeLock = null;
  }
}

let restTimerHandles = {};
let restTimerEndTimes = {};
function startRestTimer(idx, seconds){
  ensureAudioContext();
  requestWakeLock();
  if(restTimerHandles[idx]) clearInterval(restTimerHandles[idx]);
  restTimerEndTimes[idx] = Date.now() + seconds*1000;
  state.uiResting[idx] = seconds;
  render();
  restTimerHandles[idx] = setInterval(()=> tickRestTimer(idx), 1000);
}
function tickRestTimer(idx){
  if(restTimerEndTimes[idx] === undefined) return;
  const remaining = Math.max(0, Math.round((restTimerEndTimes[idx] - Date.now()) / 1000));
  state.uiResting[idx] = remaining;
  const lbl = document.getElementById(`rest-timer-${idx}`);
  if(lbl) lbl.textContent = formatMMSS(remaining);
  const overlayTime = document.getElementById('rest-overlay-time');
  if(overlayTime) overlayTime.textContent = formatMMSS(remaining);
  const overlay = document.getElementById('rest-overlay');
  if(overlay) overlay.classList.toggle('blinking', remaining <= 10);
  if(remaining <= 0){
    clearInterval(restTimerHandles[idx]);
    delete restTimerHandles[idx];
    delete restTimerEndTimes[idx];
    delete state.uiResting[idx];
    onRestFinished(idx);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    Object.keys(restTimerHandles).forEach(idx => tickRestTimer(idx));
  }
});
function cancelRestTimer(idx){
  if(restTimerHandles[idx]) clearInterval(restTimerHandles[idx]);
  delete restTimerHandles[idx];
  delete restTimerEndTimes[idx];
  delete state.uiResting[idx];
  releaseWakeLock();
  render();
}
function onRestFinished(idx){
  releaseWakeLock();
  try{
    const ctx = ensureAudioContext();
    if(ctx){
      const playTone = (freq, startTime, duration)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.4, startTime + 0.04);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      };
      const now = ctx.currentTime;
      playTone(659.25, now, 0.3);
      playTone(880, now + 0.2, 0.3);
      playTone(1174.66, now + 0.4, 0.5);
    }
  }catch(e){}
  const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
  state.uiSets[idx] = current + 1;
  state.uiRestAlert[idx] = true;
  render();
}

function firstNumber(str){
  const m = String(str).match(/\d+/);
  return m ? Number(m[0]) : null;
}
function isTimeBased(str){
  return /seg|min/i.test(String(str));
}
function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const shortsMatch = url.match(/\/shorts\/([^?&]+)/);
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortLinkMatch = url.match(/youtu\.be\/([^?&]+)/);
  if(shortsMatch) id = shortsMatch[1];
  else if(watchMatch) id = watchMatch[1];
  else if(shortLinkMatch) id = shortLinkMatch[1];
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

function routineKey(name){ return name.trim().toLowerCase(); }

function isDayCompleteOn(data, dayLabel, items, dateStr){
  return items.every((item, idx)=>{
    if(item.tipo === 'checklist'){
      const c = data.completados[dayLabel] && data.completados[dayLabel][idx];
      return !!(c && c.done && c.date === dateStr);
    }
    const entries = data.exercises[item.ejercicio] || [];
    return entries.some(e=> e.date === dateStr);
  });
}

function lastCompletionDate(data, dayLabel, items){
  const cursor = new Date();
  for(let i=0;i<30;i++){
    const ds = cursor.toISOString().slice(0,10);
    if(isDayCompleteOn(data, dayLabel, items, ds)) return ds;
    cursor.setDate(cursor.getDate()-1);
  }
  return null;
}

function lastActivityDate(data){
  const dates = getActivityDates(data);
  if(dates.size === 0) return null;
  return Array.from(dates).sort().pop();
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - then) / 86400000);
}

function weekEndInfo(semanaInicio){
  if(!semanaInicio) return null;
  const start = new Date(semanaInicio + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  const endStr = end.toISOString().slice(0,10);
  const daysLeft = daysUntil(endStr);
  return { endStr, daysLeft };
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}

function isBirthdayToday(mmdd){
  if(!mmdd) return false;
  const today = new Date();
  const todayMMDD = String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  return mmdd === todayMMDD;
}

function buildActivityFeed(adminData){
  const items = [];
  Object.keys(adminData).forEach(key=>{
    const c = adminData[key];
    Object.keys(c.data.exercises).forEach(ex=>{
      c.data.exercises[ex].forEach(e=>{
        items.push({
          key: key,
          clienta: c.displayName,
          type: 'exercise',
          exercise: ex,
          date: e.date,
          ts: e.ts || e.date,
          weight: e.weight,
          reps: e.reps,
          sets: e.sets,
          feeling: e.feeling,
          respondido: !!e.respondido,
          comment: e.comment
        });
      });
    });
    const routine = ROUTINES[key] || {};
    Object.keys(c.data.completados || {}).forEach(day=>{
      const dayItems = routine[day] || [];
      Object.keys(c.data.completados[day]).forEach(idx=>{
        const rec = c.data.completados[day][idx];
        if(rec && rec.done){
          const item = dayItems[Number(idx)];
          items.push({
            clienta: c.displayName,
            type: 'checklist',
            exercise: item ? item.ejercicio : 'Ejercicio',
            date: rec.date,
            ts: rec.ts || rec.date
          });
        }
      });
    });
  });
  items.sort((a,b)=> String(b.ts).localeCompare(String(a.ts)));
  return items;
}

async function markCommentResponded(key, exercise, ts){
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  const arr = fresh.exercises[exercise] || [];
  const entry = arr.find(e => (e.ts || e.date) === ts);
  if(entry) entry.respondido = true;
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
  render();
}

async function loadAdminData(){
  state.adminData = {};
  for(const key of Object.keys(ROUTINES)){
    const displayName = key.charAt(0).toUpperCase() + key.slice(1);
    const data = await loadClienta(displayName);
    state.adminData[key] = { displayName, data };
  }
  render();
}

};
function weeklyTarget(name){
  const cfg = CLIENT_CONFIG[routineKey(name)];
  return cfg && cfg.diasPorSemana ? cfg.diasPorSemana : 7;
}
function isMasculino(name){
  const cfg = CLIENT_CONFIG[routineKey(name)];
  return cfg && cfg.genero === 'masculino';
}

function getActivityDates(data){
  const dates = new Set();
  Object.values(data.exercises || {}).forEach(entries=>{
    entries.forEach(e=> dates.add(e.date));
  });
  Object.values(data.completados || {}).forEach(dayObj=>{
    Object.values(dayObj).forEach(v=>{
      if(v && v.done && v.date) dates.add(v.date);
    });
  });
  return dates;
}

function computeStreak(data){
  const dates = getActivityDates(data);
  if(dates.size === 0) return 0;
  const iso = d => d.toISOString().slice(0,10);
  let cursor = new Date();
  if(!dates.has(iso(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }
  let streak = 0;
  while(dates.has(iso(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeWeekCount(data){
  const dates = getActivityDates(data);
  let count = 0;
  const cursor = new Date();
  for(let i=0;i<7;i++){
    if(dates.has(cursor.toISOString().slice(0,10))) count++;
    cursor.setDate(cursor.getDate()-1);
  }
  return count;
}

function storageKey(name){ return 'clienta:' + name.trim().toLowerCase(); }

const SUPABASE_URL = 'https://yarqttoduryzhinnxgio.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IKFhc2x6r1AdB0IS8b4Nlw_TwowDq34';

async function dbGet(nombre){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes?nombre=eq.${encodeURIComponent(nombre)}&select=data`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok) throw new Error('No se pudo leer de la base');
  const rows = await res.json();
  return rows.length ? rows[0].data : null;
}

async function dbSet(nombre, data){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates'
    },
    body: JSON.stringify({ nombre, data })
  });
  if(!res.ok) throw new Error('No se pudo guardar en la base');
}

async function loadClienta(name){
  try{
    const parsed = (await dbGet(storageKey(name))) || { exercises: {} };
    if(!parsed.completados) parsed.completados = {};
    if(!parsed.bodyWeight) parsed.bodyWeight = [];
    if(!parsed.weightPromptSeen) parsed.weightPromptSeen = false;
    if(!parsed.ficha) parsed.ficha = { objetivo:'', nivel:'', restricciones:'', fechaInicio:'', cumpleanos:'', semanaInicio:'' };
    if(parsed.ficha.semanaInicio === undefined) parsed.ficha.semanaInicio = '';
    if(!parsed.vencimiento) parsed.vencimiento = '';
    if(!parsed.trainerNotes) parsed.trainerNotes = [];
    return parsed;
  }catch(e){
    return { exercises: {}, completados: {}, bodyWeight: [], weightPromptSeen: false, ficha:{ objetivo:'', nivel:'', restricciones:'', fechaInicio:'', cumpleanos:'', semanaInicio:'' }, vencimiento:'', trainerNotes: [] };
  }
}
async function saveClienta(name, data){
  try{
    await dbSet(storageKey(name), data);
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'short'});
}

    if(c.data.bodyWeight.length > 1){
      const ctx = document.getElementById('admin-weight-chart');

        type:'line',

        },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#8a8078'}, grid:{color:'rgba(43,37,33,0.07)'}}, y:{ticks:{color:'#8a8078'}, grid:{color:'rgba(43,37,33,0.07)'}} } }
      });
    }

    const notesWrap = document.getElementById('admin-notes');
    if(c.data.trainerNotes.length === 0){
      notesWrap.innerHTML = '<div class="empty">Sin notas todavía.</div>';
    } else {
      notesWrap.innerHTML = '';
      c.data.trainerNotes.slice().reverse().forEach(n=>{
        const box = document.createElement('div');
        box.className = 'tip';
        box.innerHTML = `<span class="sub" style="margin:0;">${formatDate(n.date)}</span><br/>${escapeHtml(n.text)}`;
        notesWrap.appendChild(box);
      });
    }

    const daysWrap = document.getElementById('admin-days');
    const today = todayISO();
    Object.keys(routine).forEach(dayLabel=>{
      const items = routine[dayLabel];
      const doneToday = isDayCompleteOn(c.data, dayLabel, items, today);
      const lastDate = doneToday ? today : lastCompletionDate(c.data, dayLabel, items);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div style="font-weight:700;">${escapeHtml(dayLabel)}</div><div class="sub" style="margin:2px 0 0;">${doneToday ? '✅ Completado hoy' : (lastDate ? 'Último completo: ' + formatDate(lastDate) : 'Todavía sin completar')}</div>`;
      daysWrap.appendChild(card);
    });
    const commentsWrap = document.getElementById('admin-comments');
    const comments = [];
    Object.keys(c.data.exercises).forEach(ex=>{
      c.data.exercises[ex].forEach(e=>{
        if(e.comment) comments.push({ exercise: ex, date: e.date, comment: e.comment });
      });
    });
    comments.sort((a,b)=> b.date.localeCompare(a.date));
    if(comments.length === 0){
      commentsWrap.innerHTML = '<div class="empty">Todavía no dejó comentarios.</div>';
    } else {
      comments.slice(0,15).forEach(cm=>{
        const box = document.createElement('div');
        box.className = 'tip';

        commentsWrap.appendChild(box);
      });

  }
  else if(state.view === 'exercise'){
    const entries = state.data.exercises[state.exercise] || [];

      <button class="back" id="back-btn">&larr; Volver</button>
      <div class="brand">russ.trainer</div>
      <h1>${escapeHtml(state.exercise)}</h1>
      <div class="card">
        <label>Fecha</label>
        <input type="date" id="f-date" value="${todayISO()}" />
        <div class="row">
          <div>
            <label>Peso (kg)</label>
            <input type="number" id="f-weight" step="0.5" min="0" placeholder="20" />
          </div>

            <label>Reps</label>
            <input type="number" id="f-reps" min="0" placeholder="10" />
          </div>

      <h2 style="margin-top:22px;">Historial</h2>
      <div class="card" style="border-left-color:var(--border);">
        ${entries.length === 0 ? '<div class="empty">Sin registros todavía.</div>' :

      if(item.tipo === 'mensaje') return;

      } else {
        const entries = state.data.exercises[item.ejercicio] || [];
        if(entries.some(e=> e.date === todayStr)) doneCount++;
      }
    });
    const progressPct = trackableItems.length ? Math.round((doneCount / trackableItems.length) * 100) : 0;
    const restingIdxs = Object.keys(state.uiResting);
    const overlayIdx = restingIdxs.length ? restingIdxs[0] : null;
    const overlayItem = overlayIdx !== null ? items[Number(overlayIdx)] : null;

    app.innerHTML = `
      <button class="back" id="back-btn">&larr; Volver</button>
      <div class="workout-progress-track"><div class="workout-progress-fill" style="width:${progressPct}%;"></div></div>
      <div class="brand">russ.trainer</div>

      <div id="routine-items"></div>
      ${overlayIdx !== null ? `
        <div class="rest-overlay${state.uiResting[overlayIdx] <= 10 ? ' blinking' : ''}" id="rest-overlay">

          <div class="rest-overlay-time" id="rest-overlay-time">${formatMMSS(state.uiResting[overlayIdx])}</div>

    if(overlayIdx !== null){

    }

    items.forEach((item, idx)=>{
      if(item.tipo === 'mensaje'){
        const card = document.createElement('div');
        card.className = 'personal-message-card';

      if(item.seccion !== currentSeccion){

      const videoLink = item.video ? `<a href="${escapeHtml(item.video)}" target="_blank" rel="noopener" class="video-btn">🎥 Ver técnica</a>` : '';
      const tipShown = state.uiExpanded[`tip-${idx}`];
      const tipHtml = item.nota ? (
        tipShown
          ? `<div class="tip">💡 ${escapeHtml(item.nota)}</div>`
          : `<button class="tip-toggle" data-tipidx="${idx}">💡 Ver consejo técnico</button>`
      ) : '';

      if(item.tipo === 'checklist'){
        const isDone = !!(doneToday[idx] && doneToday[idx].done);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="font-weight:700; margin-bottom:4px;">${escapeHtml(item.ejercicio)}</div>
          <div class="sub" style="margin:0 0 10px;">${escapeHtml(item.reps)}</div>
          ${videoLink}
          ${tipHtml}
          <button class="btn-primary check-btn" data-idx="${idx}" style="${isDone ? 'background:#5b8f6f;color:#0d1a12;' : ''} margin-top:8px;">${isDone ? 'Hecho ✓' : 'Marcar como hecho'}</button>
        `;
        wrap.appendChild(card);
        return;
      }

      const repsUnit = isTimeBased(item.reps) ? 'seg' : 'reps';
      const repsTarget = firstNumber(item.reps);
      const setsTarget = firstNumber(item.series);
      const todayEntries = (state.data.exercises[item.ejercicio] || []).filter(e=> e.date === todayISO());
      const lastToday = todayEntries.length ? todayEntries[todayEntries.length-1] : null;
      const editing = !!state.uiExpanded[idx];
      const selectedFeeling = state.uiFeeling[idx] !== undefined ? state.uiFeeling[idx] : (lastToday && lastToday.feeling ? lastToday.feeling : '');
      const feelings = ['😌 Fácil','👍 Justo','😮‍💨 Difícil','🥵 Al límite'];
      const card = document.createElement('div');
      card.className = 'card';
      let bodyHtml = `
        <div style="font-weight:700; margin-bottom:4px;">${escapeHtml(item.ejercicio)}</div>
        <div class="sub" style="margin:0 0 10px;">Objetivo: ${escapeHtml(item.series)} &times; ${escapeHtml(item.reps)}${item.sinPeso ? '' : ' &middot; ' + escapeHtml(item.peso)}</div>
        ${videoLink}
        ${tipHtml}

      if(lastToday && !editing){
        bodyHtml += `
          <div class="tip" style="border-left-color:#5b8f6f;">✓ Hecho hoy${item.sinPeso ? '' : ' · ' + lastToday.weight + 'kg'}${lastToday.feeling ? ' · ' + lastToday.feeling : ''}${lastToday.comment ? '<br/>💬 ' + escapeHtml(lastToday.comment) : ''}</div>
          <button class="btn-ghost edit-btn" data-idx="${idx}" style="width:100%;">✏️ Editar registro</button>
        `;
      } else {
        const setsDone = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
        const restSeconds = parseDescansoSeconds(item.descanso);
        const isResting = state.uiResting[idx] !== undefined;
        const showRestAlert = !!state.uiRestAlert[idx];
        bodyHtml += `
          ${showRestAlert ? `
            <div class="rest-alert">
              <span>💪 ¡Vamos! Arrancá la siguiente serie</span>

          ` : ''}

            ${isResting ? `
              <span class="rest-timer-display" id="rest-timer-${idx}">${formatMMSS(state.uiResting[idx])}</span>

            ` : `
              <button class="rest-start-btn" data-idx="${idx}" data-seconds="${restSeconds}">⏱️ Iniciar descanso${item.descanso ? ' (' + escapeHtml(item.descanso) + ')' : ''}</button>

          </div>
          <div class="sub" style="margin:0 0 6px;">Series hechas</div>
          <div class="set-counter">
            <button class="set-minus" data-idx="${idx}">−</button>
            <span class="count">${setsDone}${setsTarget !== null ? ' / ' + setsTarget : ''}</span>
            <button class="set-plus" data-idx="${idx}">+</button>
          </div>
          <div class="feeling-row">
            ${feelings.map(f=>`<button class="feeling-btn${selectedFeeling===f ? ' selected':''}" data-idx="${idx}" data-feeling="${escapeHtml(f)}">${f.split(' ')[0]}</button>`).join('')}
          </div>
          ${item.sinPeso ? '' : `
            <label>Peso usado (kg)</label>
            <input type="number" step="0.5" min="0" id="reg-weight-${idx}" value="${lastToday ? lastToday.weight : ''}" placeholder="0" />
          `}
          <input type="text" id="reg-comment-${idx}" value="${lastToday && lastToday.comment ? escapeHtml(lastToday.comment) : ''}" placeholder="💬 Comentario para tu entrenadora (opcional)" />
          <div class="error hidden" id="reg-error-${idx}">Ingresá el peso usado.</div>
          <button class="btn-primary registrar-btn" data-idx="${idx}" data-exercise="${escapeHtml(item.ejercicio)}" data-sinpeso="${item.sinPeso ? '1':'0'}" data-reps="${repsTarget !== null ? repsTarget : ''}" data-sets="${setsDone}" style="margin-top:4px;">Registrar</button>
        `;
      }
      card.innerHTML = bodyHtml;
      wrap.appendChild(card);
    });
    document.getElementById('back-btn').onclick = ()=>{
      Object.keys(restTimerHandles).forEach(k=> clearInterval(restTimerHandles[k]));
      releaseWakeLock();
      restTimerHandles = {};
      restTimerEndTimes = {};
      state.uiResting = {};
      state.uiRestAlert = {};
      state.view='dashboard'; state.routineDay=null; state.uiExpanded={}; state.uiFeeling={}; state.uiSets={}; render();

    });
    wrap.querySelectorAll('.tip-toggle').forEach(btn=>{

    wrap.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.uiExpanded[btn.dataset.idx] = true; render(); };
    });
    wrap.querySelectorAll('.feeling-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.uiFeeling[btn.dataset.idx] = btn.dataset.feeling; render(); };
    });
    wrap.querySelectorAll('.rest-alert-dismiss').forEach(btn=>{
      btn.onclick = ()=>{ delete state.uiRestAlert[btn.dataset.idx]; render(); };
    });
    wrap.querySelectorAll('.rest-start-btn').forEach(btn=>{
      btn.onclick = ()=>{ delete state.uiRestAlert[btn.dataset.idx]; startRestTimer(btn.dataset.idx, Number(btn.dataset.seconds)); };
    });
    wrap.querySelectorAll('.rest-cancel-btn').forEach(btn=>{
      btn.onclick = ()=> cancelRestTimer(btn.dataset.idx);
    });
    wrap.querySelectorAll('.set-plus').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
        state.uiSets[idx] = current + 1;
        render();
      };
    });
    wrap.querySelectorAll('.set-minus').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
        state.uiSets[idx] = Math.max(0, current - 1);
        render();
      };
    });
    wrap.querySelectorAll('.registrar-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const sinPeso = btn.dataset.sinpeso === '1';
        const weightInput = document.getElementById(`reg-weight-${idx}`);
        const err = document.getElementById(`reg-error-${idx}`);
        if(!sinPeso && (!weightInput || weightInput.value === '')){
          err.classList.remove('hidden');
          return;
        }
        const weight = sinPeso ? 0 : Number(weightInput.value);
        const feeling = state.uiFeeling[idx] || '';
        const commentInput = document.getElementById(`reg-comment-${idx}`);
        const comment = commentInput ? commentInput.value.trim() : '';
        onQuickSave(idx, btn.dataset.exercise, weight, btn.dataset.reps, btn.dataset.sets, feeling, comment);
      };
    });
  }
  const bottomTab = document.getElementById('bottom-tab');
  const showTab = state.clienta && !['login','welcome'].includes(state.view);
  bottomTab.classList.toggle('hidden', !showTab);
  document.getElementById('weight-tab-btn').onclick = ()=>{ state.view = 'weight'; render(); };
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function onSaveInitialWeight(){
  const input = document.getElementById('w-weight');
  const weight = input.value;
  if(weight === ''){
    await onSkipInitialWeight();
    return;
  }
  state.data.bodyWeight.push({ date: todayISO(), weight: Number(weight) });
  state.data.weightPromptSeen = true;
  await saveClienta(state.clienta, state.data);
  state.view = 'dashboard';
  render();
}

async function onSkipInitialWeight(){
  state.data.weightPromptSeen = true;
  await saveClienta(state.clienta, state.data);
  state.view = 'dashboard';
  render();
}

async function onUpdateWeight(){
  const input = document.getElementById('update-weight-input');
  const err = document.getElementById('update-weight-error');
  const weight = input.value;
  if(weight === ''){
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  state.data.bodyWeight.push({ date: todayISO(), weight: Number(weight) });
  await saveClienta(state.clienta, state.data);
  state.showWeightForm = false;
  render();
}

async function onSaveFicha(key){
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  fresh.ficha = {
    objetivo: document.getElementById('f-objetivo').value.trim(),
    nivel: document.getElementById('f-nivel').value.trim(),
    restricciones: document.getElementById('f-restricciones').value.trim(),
    fechaInicio: document.getElementById('f-fechainicio').value,
    cumpleanos: document.getElementById('f-cumple').value.trim(),
    semanaInicio: document.getElementById('f-semanainicio').value
  };
  fresh.vencimiento = document.getElementById('f-vencimiento').value;
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
  render();
}

async function onAddNote(key){
  const input = document.getElementById('note-input');
  const text = input.value.trim();
  if(!text) return;
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  fresh.trainerNotes.push({ date: todayISO(), text });
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
  render();
}

function onGenerateReport(key){
  const c = state.adminData[key];
  const streak = computeStreak(c.data);
  const weekCount = computeWeekCount(c.data);
  const target = weeklyTarget(c.displayName);
  const comments = [];
  Object.keys(c.data.exercises).forEach(ex=>{
    c.data.exercises[ex].forEach(e=>{
      const d = daysSince(e.date);
      if(e.comment && d !== null && d <= 7) comments.push(`- ${ex}: "${e.comment}"`);
    });
  });
  let text = `Resumen semanal de ${c.displayName}\n`;
  text += `Días entrenados esta semana: ${weekCount}/${target}\n`;
  text += `Racha actual: ${streak} día${streak===1?'':'s'}\n`;
  if(comments.length){
    text += `\nComentarios de la semana:\n` + comments.join('\n');
  }
  const output = document.getElementById('report-output');
  output.value = text;
  output.classList.remove('hidden');
  output.focus();
  output.select();
}

async function onEnter(){
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  const err = document.getElementById('login-error');
  if(!name){
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  if(name.toLowerCase() === 'panelruss'){
    state.view = 'admin-list';
    render();
    loadAdminData();
    return;
  }
  state.clienta = name;
  state.data = await loadClienta(name);
  state.view = state.data.weightPromptSeen ? 'dashboard' : 'welcome';
  render();
}

async function onAddExercise(){
  const exerciseSelect = document.getElementById('exercise-select');
  const name = exerciseSelect.value;
  if(!name) return;
  if(!state.data.exercises[name]){
    state.data.exercises[name] = [];
    await saveClienta(state.clienta, state.data);
  }
  render();
}

async function onSaveEntry(){
  const date = document.getElementById('f-date').value;
  const weight = document.getElementById('f-weight').value;
  const reps = document.getElementById('f-reps').value;
  const sets = document.getElementById('f-sets').value;
  const err = document.getElementById('form-error');
  if(!date || weight === '' || reps === '' || sets === ''){
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  state.data.exercises[state.exercise].push({
    date,
    weight: Number(weight),
    reps: Number(reps),
    sets: Number(sets)
  });
  state.data.exercises[state.exercise].sort((a,b)=> a.date.localeCompare(b.date));
  await saveClienta(state.clienta, state.data);
  render();
}

async function onQuickSave(idx, exerciseName, weight, reps, sets, feeling, comment){
  if(restTimerHandles[idx]){ clearInterval(restTimerHandles[idx]); delete restTimerHandles[idx]; delete restTimerEndTimes[idx]; delete state.uiResting[idx]; }
  delete state.uiRestAlert[idx];
  if(!state.data.exercises[exerciseName]){
    state.data.exercises[exerciseName] = [];
  }
  const entry = {
    date: todayISO(),
    ts: new Date().toISOString(),
    weight: Number(weight),
    reps: reps === '' ? 0 : Number(reps),
    sets: sets === '' ? 0 : Number(sets)
  };
  if(feeling) entry.feeling = feeling;
  if(comment) entry.comment = comment;
  state.data.exercises[exerciseName].push(entry);
  state.data.exercises[exerciseName].sort((a,b)=> a.date.localeCompare(b.date));
  await saveClienta(state.clienta, state.data);
  delete state.uiExpanded[idx];
  delete state.uiFeeling[idx];
  delete state.uiSets[idx];
  render();
}

async function onToggleChecklist(idx){
  const day = state.routineDay;
  if(!state.data.completados[day]) state.data.completados[day] = {};
  const current = state.data.completados[day][idx];
  const isDone = current && current.done;
  state.data.completados[day][idx] = isDone ? { done:false } : { done:true, date: todayISO(), ts: new Date().toISOString() };
  await saveClienta(state.clienta, state.data);
  render();
}

function drawChart(entries){
  const ctx = document.getElementById('progress-chart');
  if(chartInstance){ chartInstance.destroy(); }
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: entries.map(e=>formatDate(e.date)),
      datasets: [{
        label: 'Peso (kg)',
        data: entries.map(e=>e.weight),
        borderColor: '#d4848f',
        backgroundColor: 'rgba(212,132,143,0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#d4848f'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8a8078' }, grid: { color: 'rgba(43,37,33,0.07)' } },
        y: { ticks: { color: '#8a8078' }, grid: { color: 'rgba(43,37,33,0.07)' } }
      }
    }
  });
}

render();
</script>
</body>
</html>
