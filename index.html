<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<meta name="description" content="Tu rutina y tu progreso de entrenamiento">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Russ Trainer">
<meta property="og:title" content="Mi Rutina · Russ Trainer">
<meta property="og:description" content="Entra a tu rutina y registra tu progreso">
<meta property="og:url" content="https://russtrainer01-cpu.github.io/RussTrainer-rutina/">
<meta property="og:image" content="https://russtrainer01-cpu.github.io/RussTrainer-rutina/og-image.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFCF7;
    --bg-card:#F5F2E9;
    --bg-elevated:#EFEBDD;
    --rose:#d4848f;
    --rose-dark:#a85c68;
    --text:#2b2521;
    --text-muted:#8a8078;
    --border:rgba(43,37,33,0.1);
    --danger:#b85c5c;
  }
  *{box-sizing:border-box;}
  html{
    overflow-x:hidden;
    overscroll-behavior-x:none;
    -webkit-text-size-adjust:100%;
    touch-action:pan-y;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:440px;
    padding:32px 20px 90px;
    overflow-x:hidden;
  }
  .brand{
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--rose);
    text-transform:lowercase;
    margin-bottom:4px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    margin:0 0 24px;
    letter-spacing:-0.01em;
  }
  h2{
    font-size:18px;
    font-weight:700;
    margin:0 0 16px;
  }
  p.sub{
    color:var(--text-muted);
    font-size:14px;
    margin:-16px 0 24px;
    line-height:1.5;
  }
  input, select{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    font-size:16px;
    padding:12px 14px;
    border-radius:6px;
    margin-bottom:12px;
    font-family:inherit;
  }
  /* 16px minimo: con menos, el iPhone hace zoom al tocar el campo y corre la pantalla */
  input, select, textarea{ font-size:16px !important; }
  .dropset-steps{ display:flex; flex-direction:column; margin:4px 0 12px; }
  .dropset-step{ padding:12px; border-radius:10px; }
  .dropset-step input{ margin:8px 0 0; }
  .dropset-heavy{ background:rgba(168,92,104,0.16); }
  .dropset-light{ background:var(--bg-elevated); margin-left:20px; }
  .dropset-top{ display:flex; align-items:baseline; gap:10px; }
  .dropset-kg{ font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .dropset-meta{ font-size:13px; color:var(--text-muted); }
  .dropset-arrow{ margin:0 0 0 16px; padding:4px 0; font-size:13px; font-weight:700; color:var(--rose-dark); }
  button{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  input:focus, select:focus{
    outline:none;
    border-color:var(--rose);
  }
  label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  button{
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:6px;
    padding:13px 20px;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--rose);
    color:#1a0d0f;
    width:100%;
  }
  .btn-primary:active{background:var(--rose-dark);}
  .btn-ghost{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
  }
  .btn-ghost:active{background:var(--bg-elevated);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-left:3px solid var(--rose);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }
  .topbar .name{
    font-size:14px;
    color:var(--text-muted);
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--rose);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:0;
  }
  .chip-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
  }
  .chip{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:20px;
    font-size:14px;
    cursor:pointer;
  }
  .chip:active{border-color:var(--rose);}
  .chip-add{
    color:var(--rose);
    border-style:dashed;
  }
  .cq-types{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .cq-type{ background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:20px; font-size:14px; font-weight:600; }
  .cq-type.on{ background:var(--rose); border-color:var(--rose); color:#1a0d0f; }
  .cq-check{ display:flex; align-items:center; gap:12px; min-height:44px; margin:0 0 12px; font-size:15px; color:var(--text); cursor:pointer; }
  .cq-check input{ width:22px; height:22px; margin:0; flex:none; accent-color:var(--rose-dark); }
  .cq-note{ background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--rose); border-radius:4px; padding:14px 16px; margin-bottom:10px; }
  .cq-note.applied{ opacity:.72; }
  .cq-note-text{ font-size:15px; line-height:1.45; margin:0 0 8px; overflow-wrap:anywhere; }
  .cq-meta{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:12px; color:var(--text-muted); }
  .cq-badge{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; padding:2px 9px; font-weight:700; color:var(--rose-dark); }
  .cq-actions{ display:flex; gap:8px; margin-top:10px; }
  .cq-actions button{ padding:9px 12px; font-size:13px; }
  .cq-off{ background:#b85c5c; color:#fff; border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .empty{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.6;
    padding:20px 0;
  }
  .back{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--rose-dark);
    font-size:14px;
    font-weight:700;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    padding:9px 16px;
    margin-bottom:18px;
  }
  #chart-wrap{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px 14px 8px;
    margin:18px 0;
    position:relative;
    height:220px;
  }
  .entry-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-date{color:var(--text-muted);}
  .entry-detail{font-weight:600;}
  .error{
    color:var(--danger);
    font-size:13px;
    margin:-8px 0 12px;
  }
  .tip{
    background:var(--bg-elevated);
    border-left:2px solid var(--rose);
    padding:8px 12px;
    font-size:13px;
    color:var(--text-muted);
    border-radius:3px;
    margin:0 0 12px;
  }
  .login-card{
    background:var(--bg-card);
    border-radius:14px;
    box-shadow:0 8px 30px rgba(43,37,33,0.08);
    padding:36px 26px;
    margin-top:12px;
  }
  .stars{
    color:var(--rose);
    font-size:13px;
    letter-spacing:0.15em;
    margin-bottom:14px;
  }
  .tagline{
    font-style:italic;
    color:var(--rose-dark);
    font-size:14px;
    margin:0 0 6px;
  }
  @keyframes glowPulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(212,132,143,0.45); transform:translateY(0); }
    50%{ box-shadow:0 0 14px 4px rgba(212,132,143,0.35); transform:translateY(-2px); }
  }
  .day-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:14px 0 4px;
  }
  .day-card{
    flex:1 1 calc(50% - 10px);
    min-width:130px;
    background:var(--bg-card);
    color:var(--text);
    border:none;
    border-left:4px solid var(--rose);
    border-radius:10px;
    padding:16px 14px;
    text-align:left;
    cursor:pointer;
  }
  .day-card.today{
    background:linear-gradient(135deg, var(--rose), var(--rose-dark));
    color:#fff;
    border-left:4px solid #fff;
    animation:glowPulse 2.4s ease-in-out infinite;
  }
  .day-card .dc-label{
    font-weight:800;
    font-size:16px;
    color:var(--text);
  }
  .day-card.today .dc-label{
    color:#fff;
  }
  .day-card .dc-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:2px;
    font-weight:600;
  }
  .day-card.today .dc-sub{
    color:#fff;
    opacity:0.9;
  }
  .hero-today-card{
    background:linear-gradient(135deg, var(--rose-dark), var(--rose));
    border-radius:16px;
    padding:20px;
    color:#fff;
    margin:6px 0 14px;
    position:relative;
    overflow:hidden;
  }
  .hero-today-card.hero-done{
    background:linear-gradient(135deg, #3f6b3f, #5b8f6f);
  }
  .hero-kicker{
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    opacity:0.9;
  }
  .hero-title{
    font-size:21px;
    font-weight:800;
    margin:4px 0 2px;
  }
  .hero-sub{
    font-size:13px;
    opacity:0.9;
    margin-bottom:16px;
  }
  .hero-btn{
    background:#fff;
    color:var(--rose-dark);
    border:none;
    border-radius:10px;
    padding:11px 22px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .stat-card{
    background:var(--bg-card);
    border-radius:12px;
    padding:14px;
    text-align:center;
  }
  .stat-num{
    font-size:21px;
    font-weight:800;
    color:var(--rose-dark);
  }
  .stat-label{
    font-size:10px;
    font-weight:700;
    color:var(--text-muted);
    margin-top:2px;
    letter-spacing:0.03em;
  }
  .streak-banner{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    font-weight:700;
    margin:2px 0 0;
  }
  .streak-banner .dim{
    font-weight:500;
    color:var(--text-muted);
    font-size:13px;
  }
  .bottom-tab{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--bg-card);
    border-top:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    justify-content:center;
    z-index:10;
  }
  .bottom-tab button{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:6px 14px;
  }
  .video-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--bg-elevated);
    border:1px solid var(--rose);
    color:var(--rose-dark);
    font-weight:700;
    font-size:13px;
    padding:8px 14px;
    border-radius:20px;
    text-decoration:none;
    margin:0 0 12px;
    cursor:pointer;
    font-family:inherit;
  }
  .video-embed-wrap{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:10px;
    overflow:hidden;
    margin:0 0 12px;
    background:#000;
  }
  .video-embed-wrap iframe{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:none;
  }
  .feeling-row{
    display:flex;
    gap:6px;
    margin:0 0 12px;
  }
  .feeling-btn{
    flex:1;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 4px;
    font-size:19px;
    text-align:center;
    cursor:pointer;
  }
  .feeling-btn.selected{
    border-color:var(--rose);
    background:rgba(212,132,143,0.18);
  }
  .tip-toggle{
    background:none;
    border:none;
    color:var(--rose-dark);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    margin:0 0 10px;
  }
  .video-embed{
    width:100%;
    max-width:280px;
    aspect-ratio:9/16;
    border:none;
    border-radius:10px;
    margin:0 0 12px;
    display:block;
  }
  body.theme-masculine{
    --rose:#5a6472;
    --rose-dark:#333b45;
  }
  /* Login nuevo: degradado difuminado + nombre + campo y boton en pildora */
  .login-wrap.login-v2{ font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; justify-content:flex-start; position:relative; min-height:calc(100vh - 122px); }
  .lg-bg{ position:fixed; left:0; top:0; width:100%; height:min(460px,56vh); overflow:hidden; pointer-events:none; z-index:0; }
  .lg-bg i{ position:absolute; display:block; border-radius:50%; filter:blur(70px); }
  .lg-bg .b1{ left:-20%; top:-18%; width:75%; height:75%; background:#d4848f; opacity:.65; }
  .lg-bg .b2{ left:42%; top:-10%; width:70%; height:65%; background:#b98468; opacity:.45; }
  .lg-bg .b3{ left:15%; top:34%; width:75%; height:55%; background:#e9c9bd; opacity:.7; }
  .lg-bg .fade{ position:absolute; left:0; bottom:0; width:100%; height:38%; background:linear-gradient(to bottom,rgba(252,252,247,0),#FCFCF7); }
  .login-v2 > *:not(.lg-bg){ position:relative; z-index:1; }
  .lg-hero{ flex:1 1 auto; min-height:170px; max-height:330px; display:flex; align-items:center; justify-content:center; padding-top:24px; }
  .lg-name{ text-align:center; white-space:nowrap; }
  .lg-kicker{ font-size:13px; font-weight:700; letter-spacing:.42em; margin-right:-.42em; color:#4a2f27; }
  .lg-title{ margin-top:8px; font-family:'Playfair Display',Georgia,serif; font-size:56px; line-height:1; font-weight:700; color:#3b2a24; }
  .lg-title i{ font-style:italic; color:#a85c68; }
  .lg-hi{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:17px; font-weight:600; color:#6e655d; }
  .login-v2 label{ margin:28px 0 10px; font-size:16px; font-weight:900; color:#2b2521; }
  .login-v2 input{ height:58px; border-radius:29px; border:2px solid #4a2f27; background:#fff; padding:0 24px; font-size:17px; font-weight:600; margin:0; }
  .login-v2 input:focus{ border-color:#a85c68; }
  .login-v2 .error{ margin:10px 4px 0; }
  .lg-btn{ background:#4a2f27; color:#FCFCF7; margin-top:16px; height:58px; border-radius:29px; font-size:18px; font-weight:900; padding:0; }
  .lg-help{ margin-top:22px; text-align:center; font-size:14px; font-weight:600; color:#6e655d; }
  .lg-help a{ color:#a85c68; font-weight:800; }
  .login-wrap{
    min-height:calc(100vh - 64px);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .bell-btn{
    position:relative;
    top:3px;
    background:none;
    border:none;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    padding:4px;
  }
  .bell-badge{
    position:absolute;
    top:-2px;
    right:-2px;
    background:var(--rose);
    color:#fff;
    font-size:11px;
    font-weight:800;
    border-radius:10px;
    min-width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
  }
  .comment-swipe-wrap{
    position:relative;
    overflow:hidden;
    border-radius:4px;
    margin-bottom:14px;
  }
  .comment-swipe-bg{
    position:absolute;
    inset:0;
    background:#5b8f6f;
    color:#fff;
    display:flex;
    align-items:center;
    padding-left:18px;
    font-weight:700;
    border-radius:4px;
  }
  .comment-swipe-fg{
    position:relative;
    background:var(--bg-card);
    touch-action:pan-y;
  }
  .comment-check-btn{
    background:none;
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 12px;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    margin-top:8px;
  }
  .set-counter{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:16px;
    margin:0 0 14px;
  }
  .set-counter button{
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .set-minus{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text-muted);
  }
  .set-plus{
    background:var(--bg-elevated);
    border:1px solid var(--rose);
    color:var(--rose-dark);
  }
  .set-counter .count{
    font-weight:800;
    font-size:16px;
    min-width:56px;
    text-align:center;
  }
  .rest-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 14px;
  }
  .rest-start-btn{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-weight:700;
    color:var(--text);
    cursor:pointer;
  }
  .rest-timer-display{
    font-weight:800;
    font-size:20px;
    color:var(--rose-dark);
    letter-spacing:0.02em;
  }
  .rest-cancel-btn{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }
  .rest-alert{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#ff8c1a;
    color:#2b1400;
    font-weight:800;
    font-size:15px;
    padding:12px 14px;
    border-radius:8px;
    margin:0 0 14px;
    box-shadow:0 2px 10px rgba(255,140,26,0.45);
    animation:glowPulse 1.4s ease-in-out infinite;
  }
  .rest-alert button{
    background:none;
    border:none;
    color:#2b1400;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    padding:0 0 0 10px;
  }
  .workout-progress-wrap{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:440px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:2px;
    background:var(--bg);
    padding:10px 20px 8px;
    z-index:50;
    box-shadow:0 2px 6px rgba(43,37,33,0.08);
  }
  .workout-progress-label{
    font-size:11px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }
  .workout-progress-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .workout-progress-track{
    position:relative;
    flex:1;
    height:11px;
    border-radius:6px;
    overflow:hidden;
    background:linear-gradient(90deg, #d64545, #e0a52c, #4caf6d);
  }
  .workout-progress-mask{
    position:absolute;
    top:0; right:0; bottom:0;
    background:var(--bg-elevated);
    transition:width 0.4s ease;
  }
  .workout-progress-pct{
    font-size:12px;
    font-weight:800;
    color:var(--text);
    min-width:34px;
    text-align:right;
  }
  .rest-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,0.9);
    display:flex;
    flex-direction:column;

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let audioCtx = null;
async function ensureAudioContext(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){
    try{ await audioCtx.resume(); }catch(e){}
  }
  return audioCtx;
}
async function playTickSound(){
  try{
    const ctx = await ensureAudioContext();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1000;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
    gain.gain.linearRampToValueAtTime(0, now + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }catch(e){}
}

function parseDefaultWeight(pesoStr){
  if(!pesoStr) return null;
  const m = String(pesoStr).match(/(\d+(\.\d+)?)/);
  if(!m) return null;
  return parseFloat(m[1]);
}

// Dropset: devuelve { heavy, light, repsHeavy, repsLight } si el ejercicio es un dropset
// con peso tipo "35kg → baja a 25kg" y reps tipo "10 + 8"; si no, null.
function parseDropset(item){
  if(!item || item.sinPeso || !/dropset/i.test(item.ejercicio || '')) return null;
  const m = String(item.peso || '').match(/(\d+(?:\.\d+)?)\s*kg[^\d]*?(\d+(?:\.\d+)?)\s*kg/i);
  if(!m) return null;
  const r = String(item.reps || '').match(/(\d+)\s*\+\s*(\d+)/);
  return { heavy: m[1], light: m[2], repsHeavy: r ? r[1] : '', repsLight: r ? r[2] : '' };
}
function dropsetValues(weightStr, drop){
  const parts = String(weightStr || '').split(/\s*(?:y|→|\/)\s*/).map(x=>x.replace(/[^\d.]/g,''));
  return [parts[0] || '', parts[1] || ''];
}

function parseDescansoSeconds(str){
  if(!str) return 60;
  const m = String(str).match(/(\d+(\.\d+)?)/);
  if(!m) return 60;
  const num = parseFloat(m[1]);
  if(/min/i.test(str)) return Math.round(num*60);
  return Math.round(num);
}
function formatMMSS(s){
  const mi = Math.floor(s/60);
  const se = s % 60;
  return `${mi}:${String(se).padStart(2,'0')}`;
}
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){
    try{ wakeLock.release(); }catch(e){}
    wakeLock = null;
  }
}

let restTimerHandles = {};
let restTimerEndTimes = {};
let silentOscillators = {};
function startSilentKeepAlive(idx){
  ensureAudioContext().then(ctx=>{
    if(!ctx) return;
    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 20;
      gain.gain.value = 0.0005;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      silentOscillators[idx] = osc;
    }catch(e){}
  });
}
function stopSilentKeepAlive(idx){
  if(silentOscillators[idx]){
    try{ silentOscillators[idx].stop(); }catch(e){}
    delete silentOscillators[idx];
  }
}
function startRestTimer(idx, seconds){
  ensureAudioContext();
  startSilentKeepAlive(idx);
  requestWakeLock();
  const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
  state.uiSets[idx] = current + 1;
  persistUiProgress();
  if(restTimerHandles[idx]) clearInterval(restTimerHandles[idx]);
  restTimerEndTimes[idx] = Date.now() + seconds*1000;
  state.uiResting[idx] = seconds;
  render();
  restTimerHandles[idx] = setInterval(()=> tickRestTimer(idx), 1000);
}
function tickRestTimer(idx){
  if(restTimerEndTimes[idx] === undefined) return;
  const remaining = Math.max(0, Math.round((restTimerEndTimes[idx] - Date.now()) / 1000));
  state.uiResting[idx] = remaining;
  const lbl = document.getElementById(`rest-timer-${idx}`);
  if(lbl) lbl.textContent = formatMMSS(remaining);
  const overlayTime = document.getElementById('rest-overlay-time');
  if(overlayTime) overlayTime.textContent = formatMMSS(remaining);
  const overlay = document.getElementById('rest-overlay');
  if(overlay) overlay.classList.toggle('blinking', remaining <= 10);
  if(remaining > 0 && remaining <= 10) playTickSound();
  if(remaining <= 0){
    clearInterval(restTimerHandles[idx]);
    delete restTimerHandles[idx];
    delete restTimerEndTimes[idx];
    delete state.uiResting[idx];
    onRestFinished(idx);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    Object.keys(restTimerHandles).forEach(idx => tickRestTimer(idx));
  }
});
function cancelRestTimer(idx){
  if(restTimerHandles[idx]) clearInterval(restTimerHandles[idx]);
  delete restTimerHandles[idx];
  delete restTimerEndTimes[idx];
  delete state.uiResting[idx];
  stopSilentKeepAlive(idx);
  releaseWakeLock();
  render();
}
let pendingCircuitEntries = {};
async function onRestFinished(idx){
  releaseWakeLock();
  stopSilentKeepAlive(idx);
  try{
    const ctx = await ensureAudioContext();
    if(ctx){
      const playTone = (freq, startTime, duration)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.9, startTime + 0.04);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      };
      const now = ctx.currentTime;
      playTone(659.25, now, 0.3);
      playTone(880, now + 0.2, 0.3);
      playTone(1174.66, now + 0.4, 0.5);
      playTone(880, now + 0.7, 0.3);
      playTone(1174.66, now + 0.9, 0.6);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([250,100,250,100,250]);
  if(String(idx).indexOf('circex-') === 0){
    const pending = pendingCircuitEntries[idx];
    if(pending){
      const exercise = pending.exercise;
      if(!state.data.exercises[exercise]) state.data.exercises[exercise] = [];
      const entry = {
        date: todayISO(),
        ts: new Date().toISOString(),
        ronda: state.uiCircuit[pending.cidx] ? state.uiCircuit[pending.cidx].round : 1,
        weight: pending.peso || '',
        reps: pending.reps,
        sets: 1,
        feeling: pending.feeling || ''
      };
      if(pending.comment) entry.comment = pending.comment;
      state.data.exercises[exercise].push(entry);
      delete pendingCircuitEntries[idx];
      saveClienta(state.clienta, state.data);
    }
    render();
    return;
  }
  state.uiRestAlert[idx] = true;
  setTimeout(()=>{
    if(state.uiRestAlert[idx]){
      delete state.uiRestAlert[idx];
      render();
    }
  }, 6000);
  render();
}

function firstNumber(str){
  const m = String(str).match(/\d+/);
  return m ? Number(m[0]) : null;
}
function isTimeBased(str){
  return /seg|min/i.test(String(str));
}
function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const shortsMatch = url.match(/\/shorts\/([^?&]+)/);
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortLinkMatch = url.match(/youtu\.be\/([^?&]+)/);
  if(shortsMatch) id = shortsMatch[1];
  else if(watchMatch) id = watchMatch[1];
  else if(shortLinkMatch) id = shortLinkMatch[1];
  return id ? `https://www.youtube.com/embed/${id}?playsinline=1&rel=0&modestbranding=1` : null;
}

function getCalendarEventsForMonth(year, month){
  const map = {};
  function addEvent(dateStr, ev){
    if(!map[dateStr]) map[dateStr] = [];
    map[dateStr].push(ev);
  }
  const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
  Object.keys(state.adminData || {}).forEach(key=>{
    const c = state.adminData[key];
    const f = c.data.ficha;
    if(f.cumpleanos && /^\d{2}-\d{2}$/.test(f.cumpleanos)){
      const mm = String(month+1).padStart(2,'0');
      if(f.cumpleanos.slice(0,2) === mm){
        const dd = f.cumpleanos.slice(3,5);
        addEvent(`${year}-${mm}-${dd}`, { type:'cumple', icon:'🎂', label: c.displayName, color:'#c9974a', key });
      }
    }
    if(c.data.vencimiento && c.data.vencimiento.slice(0,7) === monthStr){
      addEvent(c.data.vencimiento, { type:'vencimiento', icon:'💳', label: c.displayName, color:'#c65f5f', key });
    }
    const wi = weekEndInfo(f.semanaInicio);
    if(wi && wi.endStr.slice(0,7) === monthStr){
      addEvent(wi.endStr, { type:'semana', icon:'📅', label: c.displayName, color:'#d4848f', key });
    }
  });
  const todayStr = todayISO();
  if(todayStr.slice(0,7) === monthStr && state.adminData){
    const feed = buildActivityFeed(state.adminData).filter(i=>i.comment && !i.respondido);
    const byClient = {};
    feed.forEach(i=>{ byClient[i.key] = (byClient[i.key]||0) + 1; });
    Object.keys(byClient).forEach(key=>{
      const c = state.adminData[key];
      addEvent(todayStr, { type:'comentario', icon:'💬', label: c.displayName + ' (' + byClient[key] + ')', color:'#4a90b8', key });
    });
  }
  agGet().tareas.forEach(t=>{
    if(!t.idea && t.fecha && t.fecha.slice(0,7) === monthStr){
      addEvent(t.fecha, { type:'tarea', icon:'✅', label: (t.hora ? t.hora + ' · ' : '') + t.t, color:'#3d5afe', done:t.done });
    }
  });
  (state.trainerEvents || []).forEach(ev=>{
    if(ev.date.slice(0,7) === monthStr){
      addEvent(ev.date, { type:'custom', icon:'📌', label: ev.text, color:'#6fa86f' });
    }
  });
  return map;
}

function routineKey(name){ return authSlug(name); }

function parseDayLabel(label){
  const m = label.match(/^(?:Mes (\d+) - )?Semana (\d+) - (.+)$/);
  if(m){
    const mes = m[1] ? parseInt(m[1]) : null;
    const semana = parseInt(m[2]);
    const groupKey = (mes || 0) * 1000 + semana;
    const groupLabel = mes ? `Mes ${mes} · Semana ${semana}` : `Semana ${semana}`;
    return { mes, semana, dayName: m[3], groupKey, groupLabel };
  }
  return { mes: null, semana: null, dayName: label, groupKey: null, groupLabel: null };
}
function getMaxSemana(routine){
  let max = null;
  Object.keys(routine).forEach(label=>{
    const p = parseDayLabel(label);
    if(p.groupKey !== null) max = max === null ? p.groupKey : Math.max(max, p.groupKey);
  });
  return max;
}
// Semana actual de una alumna: NO es la ultima planificada, asi se puede dejar planificado
// el mes completo sin que cambie lo que ve hoy. Es la semana mas avanzada en la que ya
// hizo algun dia; pasa a la siguiente cuando completo todos los dias de esa semana o
// cuando lleva 7 dias o mas sin completar nada en ella (y existe una semana posterior).
function getCurrentSemana(data, routine){
  const { groups } = groupDaysBySemana(routine);
  const keys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  if(!keys.length) return null;
  if(!data) return keys[0];
  let cur = null;
  keys.forEach(k=>{
    if(groups[k].some(d=> isDayEverComplete(data, d, routine[d]))) cur = k;
  });
  if(cur === null) return keys[0];
  const next = keys.filter(k=> k > cur)[0];
  if(next === undefined) return cur;
  const days = groups[cur];
  const allDone = days.every(d=> isDayEverComplete(data, d, routine[d]));
  let lastDone = null;
  days.forEach(d=>{
    const ds = lastCompletionDate(data, d, routine[d]);
    if(ds && (!lastDone || ds > lastDone)) lastDone = ds;
  });
  const stale = lastDone === null || daysSince(lastDone) >= 7;
  return (allDone || stale) ? next : cur;
}
function groupDaysBySemana(routine){
  const groups = {};
  const groupLabels = {};
  const noSemana = [];
  Object.keys(routine).forEach(label=>{
    const p = parseDayLabel(label);
    if(p.groupKey === null){ noSemana.push(label); return; }
    if(!groups[p.groupKey]) groups[p.groupKey] = [];
    groups[p.groupKey].push(label);
    groupLabels[p.groupKey] = p.groupLabel;
  });
  return { groups, groupLabels, noSemana };
}

function isDayCompleteOn(data, dayLabel, items, dateStr){
  const finR = data.completados[dayLabel] && data.completados[dayLabel]['fin'];
  if(finR && finR.done && finR.date === dateStr) return true;
  return items.every((item, idx)=>{
    if(item.tipo === 'mensaje') return true;
    if(item.tipo === 'checklist'){
      const c = data.completados[dayLabel] && data.completados[dayLabel][idx];
      return !!(c && c.done && c.date === dateStr);
    }
    if(item.tipo === 'circuito'){
      const forced = data.completados[dayLabel] && data.completados[dayLabel]['circuit-' + idx];
      if(forced && forced.done && forced.date === dateStr) return true;
      return item.ejercicios.every(ex=>{
        const entries = (data.exercises[ex.ejercicio] || []).filter(e=> e.date === dateStr);
        return entries.length >= item.rondas;
      });
    }
    const entries = data.exercises[item.ejercicio] || [];
    return entries.some(e=> e.date === dateStr);
  });
}

function lastCompletionDate(data, dayLabel, items){
  const cursor = new Date();
  for(let i=0;i<30;i++){
    const ds = localISO(cursor);
    if(isDayCompleteOn(data, dayLabel, items, ds)) return ds;
    cursor.setDate(cursor.getDate()-1);
  }
  return null;
}

function getNextRotationDay(data, routine, candidateDays){
  if(!candidateDays.length) return null;
  let lastCompletedIdx = -1;
  let lastCompletedDateStr = null;
  candidateDays.forEach((d, i)=>{
    const dateStr = lastCompletionDate(data, d, routine[d]);
    if(dateStr && (!lastCompletedDateStr || dateStr > lastCompletedDateStr || (dateStr === lastCompletedDateStr && i > lastCompletedIdx))){
      lastCompletedDateStr = dateStr;
      lastCompletedIdx = i;
    }
  });
  if(lastCompletedIdx === -1) return candidateDays[0];
  return candidateDays[(lastCompletedIdx + 1) % candidateDays.length];
}

function lastActivityDate(data){
  const dates = getActivityDates(data);
  if(dates.size === 0) return null;
  return Array.from(dates).sort().pop();
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - then) / 86400000);
}

function computeMonthNumber(fechaInicio){
  if(!fechaInicio) return null;
  const start = new Date(fechaInicio + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  const days = Math.floor((now - start) / 86400000);
  if(days < 0) return null;
  return Math.floor(days / 30) + 1;
}
const MONTH_COLORS = ['#d4848f', '#4a90b8', '#6fa86f', '#c9974a', '#9b7bc9', '#c96f8f', '#5aa8a0'];
function monthColor(monthNum){
  return MONTH_COLORS[(monthNum - 1) % MONTH_COLORS.length];
}

function weekEndInfo(semanaInicio){
  if(!semanaInicio) return null;
  const start = new Date(semanaInicio + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  const endStr = localISO(end);
  const daysLeft = daysUntil(endStr);
  return { endStr, daysLeft };
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}

function isBirthdayToday(mmdd){
  if(!mmdd) return false;
  const today = new Date();
  const todayMMDD = String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  return mmdd === todayMMDD;
}

function buildActivityFeed(adminData){
  const items = [];
  Object.keys(adminData).forEach(key=>{
    const c = adminData[key];
    Object.keys(c.data.exercises).forEach(ex=>{
      c.data.exercises[ex].forEach(e=>{
        items.push({
          key: key,
          clienta: c.displayName,
          type: 'exercise',
          exercise: ex,
          date: e.date,
          ts: e.ts || e.date,
          weight: e.weight,
          reps: e.reps,
          sets: e.sets,
          feeling: e.feeling,
          respondido: !!e.respondido,
          comment: e.comment
        });
      });
    });
    const routine = ROUTINES[key] || {};
    Object.keys(c.data.completados || {}).forEach(day=>{
      const dayItems = routine[day] || [];
      Object.keys(c.data.completados[day]).forEach(idx=>{
        const rec = c.data.completados[day][idx];
        if(rec && rec.done){
          const item = dayItems[Number(idx)];
          items.push({
            key: key,
            clienta: c.displayName,
            type: 'checklist',
            exercise: item ? item.ejercicio : 'Ejercicio',
            date: rec.date,
            ts: rec.ts || rec.date
          });
        }
      });
    });
  });
  items.sort((a,b)=> String(b.ts).localeCompare(String(a.ts)));
  return items;
}

function pnUrgent(r){
  const f = r.c.data.ficha, wi = weekEndInfo(f.semanaInicio);
  const needsNew = !f.semanaInicio || (wi && wi.daysLeft <= 0);
  const soon = !!(wi && wi.daysLeft > 0 && wi.daysLeft <= 3);
  const gap = daysSince(lastActivityDate(r.c.data));
  const inactive = gap === null || gap >= 3;
  const pc = buildActivityFeed({[r.key]: r.c}).filter(i=>i.comment && !i.respondido).length;
  const venc = daysUntil(r.c.data.vencimiento);
  const vence = venc !== null && venc <= 7;
  const items = [];
  if(needsNew) items.push(['rd', 'Armar semana nueva']);
  else if(soon) items.push(['am', 'Su semana termina en ' + wi.daysLeft + (wi.daysLeft === 1 ? ' día' : ' días')]);
  if(inactive) items.push(['rd', gap === null ? 'Sin actividad todavía' : gap + ' días sin entrenar']);
  if(pc) items.push(['am', pc + (pc === 1 ? ' comentario sin responder' : ' comentarios sin responder')]);
  if(vence) items.push(['am', venc < 0 ? 'Plan vencido' : venc === 0 ? 'Su plan vence hoy' : 'Su plan vence en ' + venc + ' días']);
  const urg = (needsNew ? 20 : 0) + (soon ? 8 : 0) + (inactive ? 10 : 0) + pc * 2 + (vence ? 6 : 0);
  return { needsNew, soon, wi, gap, inactive, pc, venc, vence, items, urg };
}

    if(!arr.length) return;
    const nums = arr.map(e=> parseFloat(String(e.weight).replace(',', '.'))).filter(n=> isFinite(n) && n > 0);
    const last = arr[arr.length - 1];

    const pct = (first && cur && nums.length > 1) ? Math.round((cur - first) / first * 100) : null;

    const ready = /F[aá]cil/i.test(fl) && nums.length > 0;
    const review = /l[ií]mite/i.test(fl);
    rows.push({ name, n: arr.length, nums, first, cur, pct, ready, review, last });
  });
  rows.sort((a,b)=> (b.review - a.review) || (b.ready - a.ready) || ((b.pct === null ? -1 : b.pct) - (a.pct === null ? -1 : a.pct)));
  return rows;

function pnSpark(nums, col){
  if(nums.length < 2) return '<svg width="90" height="30"><path d="M2 15H88" stroke="#c9cfdd" stroke-width="2.5" stroke-linecap="round"/></svg>';
  const mn = Math.min.apply(null, nums), mx = Math.max.apply(null, nums), rg = (mx - mn) || 1;
  const pts = nums.map((v,i)=> (2 + i * 86 / (nums.length - 1)).toFixed(1) + ' ' + (27 - (v - mn) / rg * 24).toFixed(1));
  return '<svg width="90" height="30"><path d="M' + pts.join(' L') + '" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

async function supResize(file, max){
  if(window.createImageBitmap){
    try{ const bmp = await createImageBitmap(file); const k = Math.min(1, max / Math.max(bmp.width, bmp.height)); const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.78); }catch(e){}
  }
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

  const nu = $('sp-nuevo'); if(nu) nu.onclick = ()=>{ st.msg = ''; st.edit = { id:'', nombre:'', marca:'', precio:'', categoria:'Proteínas', resumen:'', sirve:'', como:'', cuando:'', cuidado:'', recomendado:false, disponible:true, foto:'', fotos:[] }; render(); };
  main.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>{ const p = st.items.find(x=>x.id === b.getAttribute('data-edit')); if(p){ st.msg = ''; st.edit = JSON.parse(JSON.stringify(p)); if(!Array.isArray(st.edit.fotos)) st.edit.fotos = st.edit.foto ? [st.edit.foto] : []; render(); } });
  main.querySelectorAll('[data-sw]').forEach(b=> b.onclick = async ()=>{ const p = st.items.find(x=>x.id === b.getAttribute('data-sw')); if(!p) return; p.disponible = p.disponible === false; await supSave(); render(); });
  main.querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{ const p = st.items.find(x=>x.id === b.getAttribute('data-del')); if(!p || !confirm('¿Borrar "' + p.nombre + '"?')) return; st.items = st.items.filter(x=>x.id !== p.id); await supSave(); render(); });
  if(e){
    const read = ()=>{ ['nombre','marca','resumen','sirve','como','cuando','cuidado'].forEach(k=>{ e[k] = $('sp-' + k).value.trim(); }); e.precio = $('sp-precio').value; e.categoria = $('sp-cat').value; e.recomendado = $('sp-rec').checked; };
    const persist = async (msg)=>{ e.foto = (e.fotos || [])[0] || ''; if(e.id && e.nombre){ e.precio = e.precio === '' ? 0 : Number(e.precio); st.items = st.items.map(x=> x.id === e.id ? e : x); await supSave(); if(/^Guardado/.test(st.msg)) st.msg = msg; } };
    const pf = $('sp-foto'); if(pf) pf.onclick = ()=> $('sp-file').click();
    $('sp-file').onchange = async ()=>{
      const files = Array.from($('sp-file').files || []); if(!files.length) return; read();
      $('sp-err').textContent = 'Subiendo la foto…';
      e.fotos = e.fotos || [];
      for(const f of files){ if(e.fotos.length >= 3) break; try{ e.fotos.push(await supResize(f, 520)); }catch(x){ $('sp-err').textContent = 'No se pudo leer esa foto. Prueba con otra o súbela como captura de pantalla.'; return; } }
      await persist('Foto guardada ✓'); render();
    };
    main.querySelectorAll('[data-rf]').forEach(b=> b.onclick = async ()=>{ read(); e.fotos.splice(Number(b.getAttribute('data-rf')), 1); await persist('Foto quitada ✓'); render(); });
    $('sp-cancel').onclick = ()=>{ st.edit = null; render(); };
    $('sp-guardar').onclick = async ()=>{
      read();
      if(!e.nombre){ $('sp-err').textContent = 'Falta el nombre'; return; }
      if(e.precio === '' || Number(e.precio) < 0){ $('sp-err').textContent = 'Falta el precio'; return; }
      e.precio = Number(e.precio); e.foto = (e.fotos || [])[0] || '';
      if(e.id){ st.items = st.items.map(x=> x.id === e.id ? e : x); } else { e.id = agId(); st.items.push(e); }
      st.edit = null; await supSave(); render();
    };
  }
}

function agEmpty(){ return { tareas:[], semana:{}, repetir:[], hechas:{}, norte:null, ocultas:null }; }
function agNorm(d){ const b = agEmpty(); d = d || {}; Object.keys(b).forEach(k=>{ if(d[k] !== undefined && d[k] !== null) b[k] = d[k]; }); b.norte = d.norte || null; b.ocultas = Array.isArray(d.ocultas) ? d.ocultas : null; return b; }

async function agSync(){
  if(agBusy){ agAgain = true; return; }
  agBusy = true;
  try{
    do{
      agAgain = false;
      const batch = agPending.slice();
      const fresh = agNorm(await dbGet(AG_ROW));
      batch.forEach(f=> f(fresh));
      const cut = new Date(); cut.setDate(cut.getDate() - 14); const cutISO = localISO(cut);
      Object.keys(fresh.hechas).forEach(k=>{ if(k < cutISO) delete fresh.hechas[k]; });
      fresh.tareas = fresh.tareas.filter(t=> !(t.done && t.fecha && t.fecha < cutISO));

      state.agenda = fresh; agStore(); agLoaded = true; state.agSync = agPending.length ? 'off' : 'ok';

function agParse(txt){
  let t = ' ' + txt + ' ', fecha = null, hora = '';
  const m = t.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
  if(m){ hora = m[1].padStart(2,'0') + ':' + m[2]; t = t.replace(m[0], ' '); }
  if(/\bmañana\b/i.test(t)){ fecha = agTomorrow(); t = t.replace(/\bmañana\b/i, ' '); }
  else if(/\bhoy\b/i.test(t)){ fecha = agToday(); t = t.replace(/\bhoy\b/i, ' '); }
  if(hora && !fecha) fecha = agToday();
  t = t.replace(/\s+/g, ' ').trim();
  return { t: t || txt.trim(), fecha, hora };

function agSoundOn(){ try{ return localStorage.getItem('rt_ag_mute') !== '1'; }catch(e){ return true; } }
async function agChime(all){
  if(!agSoundOn()) return;
  const ctx = await ensureAudioContext(); if(!ctx) return;
  const t0 = ctx.currentTime + 0.01;
  const tone = (f, at, dur, type, vol)=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + at);
    g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t0 + at); o.stop(t0 + at + dur + 0.05);
  };
  if(all){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i)=>{ tone(f, i * 0.09, 0.7, 'triangle', 0.16); tone(f * 2, i * 0.09, 0.4, 'sine', 0.04); }); }
  else { tone(880, 0, 0.45, 'sine', 0.16); tone(1318.5, 0.09, 0.6, 'sine', 0.14); tone(2637, 0.09, 0.25, 'sine', 0.03); }
}

    <button class="ag-save" id="agm-s">Guardar en Bandeja</button></div>`;
  document.body.appendChild(m);

    m.querySelectorAll('[data-tp]').forEach(b=> b.classList.toggle('on', b.getAttribute('data-tp') === tipo));
    m.querySelectorAll('[data-c]').forEach(b=> b.classList.toggle('on', b.getAttribute('data-c') === cat));

  };

  m.querySelectorAll('[data-c]').forEach(b=> b.onclick = ()=>{ cat = b.getAttribute('data-c'); upd(); });

  m.querySelectorAll('[data-w]').forEach(b=> b.onclick = ()=>{ cuando = b.getAttribute('data-w'); upd(); });

    else {

    tx.textContent = 'Guardado ✓'; tx.style.display = 'block'; setTimeout(()=>{ tx.style.display = 'none'; }, 1600);
  };
  $('#agm-s').onclick = save;
  $('#agm-t').onkeydown = e=>{ if(e.key === 'Enter') save(); if(e.key === 'Escape') close(); };
  upd(); $('#agm-t').focus();
}

function edSplit(label){
  const m = label.match(/^(.*?Día \d+)(?: - (.+))?$/);
  return m ? { pre:m[1], nom:m[2] || '' } : { pre:'', nom:label };
}
function edLabel(d){ return d.pre ? (d.nom ? d.pre + ' - ' + d.nom : d.pre) : d.nom; }
function edBuild(key){
  const rt = ROUTINES[key] || {};
  const days = Object.keys(rt).map(k=>{ const sp = edSplit(k); return { pre:sp.pre, nom:sp.nom, items: JSON.parse(JSON.stringify(rt[k])) }; });
  return { key, days, dirty:false, open:{}, msg:'' };
}
function edGroups(ed){
  const g = [];
  ed.days.forEach((d, i)=>{
    const info = parseDayLabel(edLabel(d));
    const gk = info.groupKey === null ? 'x' : info.groupKey, gl = info.groupLabel || 'Rutina';
    let grp = g.find(x=>x.k === gk);
    if(!grp){ grp = { k:gk, label:gl, idx:[] }; g.push(grp); }
    grp.idx.push(i);
  });
  return g;
}
function edVideoMap(){
  const m = {};
  Object.keys(ROUTINES).forEach(k=> Object.keys(ROUTINES[k]).forEach(d=> ROUTINES[k][d].forEach(e=>{ if(e.ejercicio && e.video && !m[e.ejercicio]) m[e.ejercicio] = e.video; })));
  return m;
}
function edNames(){
  const s = new Set();
  Object.keys(EXERCISE_LIBRARY).forEach(c=> EXERCISE_LIBRARY[c].forEach(n=> s.add(n)));
  Object.keys(ROUTINES).forEach(k=> Object.keys(ROUTINES[k]).forEach(d=> ROUTINES[k][d].forEach(e=>{ if(e.ejercicio) s.add(e.ejercicio); })));
  return Array.from(s).sort((a,b)=>a.localeCompare(b));
}
function edSections(){
  const s = new Set();
  Object.keys(ROUTINES).forEach(k=> Object.keys(ROUTINES[k]).forEach(d=> ROUTINES[k][d].forEach(e=>{ if(e.seccion) s.add(e.seccion); })));
  return Array.from(s);
}
const ED_MIN = 10;
const ED_OPT = {
  series:['2 series','3 series','4 series','5 series','6 series'],
  reps:['6','8','10','12','13','15','18','20','25','30 seg','45 seg','60 seg','Hasta el fallo'],

  descanso:['20 seg','25 seg','30 seg','35 seg','40 seg','45 seg','60 seg','90 seg','2 min']
};
function edLib(){ if(!state.edLib) state.edLib = { notas:{}, custom:{ series:[], reps:[], peso:[], descanso:[] } }; return state.edLib; }
function edLoadLib(cb){

  dbGet('admin:biblioteca').then(d=>{ if(d){ const l = edLib(); l.notas = d.notas || {}; l.custom = Object.assign({ series:[], reps:[], peso:[], descanso:[] }, d.custom || {}); if(cb) cb(); } }).catch(()=>{ state.edLibLoaded = false; });

function edLibNota(name){

function edMuscle(sec){ return String(sec || '').replace(/^[^\p{L}]+/u, '').trim() || 'Otros'; }
function edNorm(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function edCatalog(){
  const cats = [];
  const add = (sec, name)=>{
    const m = edMuscle(sec); let c = cats.find(x=> edMuscle(x.sec) === m);
    if(!c){ c = { sec, names:[] }; cats.push(c); }
    if(name && c.names.indexOf(name) < 0) c.names.push(name);
  };
  Object.keys(EXERCISE_LIBRARY).forEach(k=> { add(k); EXERCISE_LIBRARY[k].forEach(n=> add(k, n)); });
  Object.keys(ROUTINES).forEach(k=> Object.keys(ROUTINES[k]).forEach(d=> ROUTINES[k][d].forEach(e=>{ if(e.ejercicio && e.seccion && (e.tipo === 'carga' || e.tipo === 'checklist')) add(e.seccion, e.ejercicio); })));
  cats.forEach(c=> c.names.sort((a,b)=> a.localeCompare(b)));
  return cats;
}
function edSecOptions(){ return edCatalog().map(c=>c.sec); }
function edSel(ed, di, ii, f, val, ph){

function edSumData(ed){
  const groups = edGroups(ed);
  let g = groups.find(x=> String(x.k) === String(ed.focusWeek));
  if(!g) { const open = groups.filter(x=> ed.open[x.k]); g = open.length ? open[open.length - 1] : groups[groups.length - 1]; }
  if(!g) return null;
  const mus = {}; let total = 0; const perDay = [];
  g.idx.forEach(di=>{
    const d = ed.days[di]; let dn = 0;
    d.items.forEach(it=>{
      if(it.tipo !== 'carga') return;
      const sr = parseInt(it.series, 10) || 0; if(!sr) return;
      const m = edMuscle(it.seccion); if(/movilidad/i.test(m)) return;
      const sec = it.seccion || m;
      mus[m] = mus[m] || { sec, n:0 }; mus[m].n += sr; total += sr; dn += sr;
    });
    const mm = d.pre.match(/Día (\d+)/); perDay.push({ lb: mm ? 'Día ' + mm[1] : 'Día', n: dn });
  });
  return { label: g.label, total, rows: Object.keys(mus).map(k=> ({ m:k, sec:mus[k].sec, n:mus[k].n })).sort((a,b)=> b.n - a.n), perDay, days: g.idx.length };
}
function edSumHtml(ed){

function getActivityDates(data){
  const dates = new Set();
  Object.values(data.exercises || {}).forEach(entries=>{
    entries.forEach(e=> dates.add(e.date));
  });
  Object.values(data.completados || {}).forEach(dayObj=>{
    Object.values(dayObj).forEach(v=>{
      if(v && v.done && v.date) dates.add(v.date);
    });
  });
  return dates;
}

function computeStreak(data){
  const dates = getActivityDates(data);
  if(dates.size === 0) return 0;
  const iso = localISO;
  let cursor = new Date();
  if(!dates.has(iso(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }
  let streak = 0;
  while(dates.has(iso(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeWeekCount(data){
  const dates = getActivityDates(data);
  let count = 0;
  const cursor = new Date();
  for(let i=0;i<7;i++){
    if(dates.has(localISO(cursor))) count++;
    cursor.setDate(cursor.getDate()-1);
  }
  return count;
}

const OLD_HOME_USERS = ['anderson','roiner'];
function usesNewHome(name){ return OLD_HOME_USERS.indexOf(routineKey(name)) === -1; }

// Igual que computeWeekCount, pero un día en que solo se hizo el extra (Día Juntos) no cuenta.
function computeWeekCountNoExtra(data, routine){
  const { noSemana } = groupDaysBySemana(routine);
  const extraNames = new Set();
  noSemana.forEach(d=> routine[d].forEach(it=>{
    if(it.tipo === 'circuito') it.ejercicios.forEach(e=> extraNames.add(e.ejercicio));
    else if(it.ejercicio) extraNames.add(it.ejercicio);
  }));
  const dates = getActivityDates(data);
  let count = 0;
  const cursor = new Date();
  for(let i=0;i<7;i++){
    const ds = localISO(cursor);
    if(dates.has(ds)){
      const names = Object.keys(data.exercises || {}).filter(n=> (data.exercises[n] || []).some(e=> e.date === ds));
      const doneLabels = Object.keys(data.completados || {}).filter(l=> Object.values(data.completados[l] || {}).some(v=> v && v.done && v.date === ds));
      const regularLabel = doneLabels.some(l=> noSemana.indexOf(l) === -1);
      const regularName = names.some(n=> !extraNames.has(n));
      // Un día solo con actividad del extra (Día Juntos) no suma al conteo semanal.
      if(regularLabel || regularName || (names.length === 0 && doneLabels.length === 0)) count++;
    }
    cursor.setDate(cursor.getDate()-1);
  }
  return count;
}

function isDayEverComplete(data, day, items){
  const dates = Array.from(getActivityDates(data));
  return dates.some(ds=> isDayCompleteOn(data, day, items, ds));
}

// Sonido suave al avanzar en la guia (campanita de dos notas; sube un poco en cada paso)
function guideChime(step, kind){
  try{
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; audioCtx = new AC(); }
    if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
    const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // do re mi sol la do (pentatonica)
    const base = scale[(step || 0) % scale.length];
    const notes = kind === 'final' ? [base, base*1.25, base*1.5, base*2] : kind === 'back' ? [base*0.75] : [base, base*1.5];
    const t0 = audioCtx.currentTime + 0.02;
    notes.forEach((f, i)=>{
      const t = t0 + i * (kind === 'final' ? 0.11 : 0.09);
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(kind === 'back' ? 0.08 : 0.16, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === 'final' ? 0.7 : 0.45));
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.75);
    });
  }catch(e){}
}

  if(guideScreen() !== prev) render(); else guideShowStep();
}

// ---- Descargar la rutina del día como PDF (queda en Descargas) ----
function descargarRutinaPDF(items){
  try{
    const W = 1080, PAD = 56;
    const rose = '#d4848f', roseDark = '#a85c68', ink = '#2b2521', muted = '#8a8078', card = '#F5F2E9';
    const nombre = (state.clienta || '').trim(); const nombreBonito = nombre.charAt(0).toUpperCase() + nombre.slice(1);
    const fecha = new Date().toLocaleDateString('es-AR', { day:'2-digit', month:'long' });
    const fnt = (w, px)=> w + ' ' + px + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
    function lineOf(it){
      const parts = [];
      if(it.series && it.series !== '-') parts.push(it.series);
      if(it.reps) parts.push(/^\d+$/.test(String(it.reps)) ? it.reps + ' reps' : it.reps);
      if(it.peso && it.peso !== 'Sin peso') parts.push(it.peso);
      if(it.descanso) parts.push('desc. ' + it.descanso);
      return parts.join('  ·  ');
    }
    function draw(ctx, H){
      let y = 0;
      if(H){ ctx.fillStyle = '#FCFCF7'; ctx.fillRect(0, 0, W, H); }
      if(H){ ctx.fillStyle = rose; ctx.fillRect(0, 0, W, 190); }
      if(H){
        ctx.fillStyle = '#fff'; ctx.font = fnt('700', 46); ctx.fillText('Rutina de ' + nombreBonito, PAD, 82);
        ctx.font = fnt('400', 30); ctx.fillText(String(state.routineDay), PAD, 140);
      }
      y = 190 + 40;
      let sec = null;
      const row = (title, sub, extra)=>{
        const h = 34 + (sub ? 44 : 0) + (extra || 0) + 30;
        if(H){ ctx.fillStyle = card; ctx.beginPath(); ctx.roundRect(PAD, y, W - PAD*2, h, 20); ctx.fill();
          ctx.fillStyle = ink; ctx.font = fnt('700', 34); ctx.fillText(title, PAD + 28, y + 52);
          if(sub){ ctx.fillStyle = muted; ctx.font = fnt('400', 29); ctx.fillText(sub, PAD + 28, y + 98); } }
        y += h + 16;
      };
      items.forEach(it=>{
        if(it.tipo === 'mensaje') return;
        if(it.seccion && it.seccion !== sec){
          sec = it.seccion; y += 10;
          if(H){ ctx.fillStyle = roseDark; ctx.font = fnt('700', 30); ctx.fillText(sec, PAD, y + 30); }
          y += 52;
        }
        if(it.tipo === 'circuito'){
          row(it.titulo || 'Circuito', it.rondas + ' rondas' + (it.descansoRondas ? '  ·  descanso ' + it.descansoRondas : ''), 0);
          (it.ejercicios || []).forEach(ex=> row(ex.ejercicio, [ex.reps, ex.peso && ex.peso !== 'Sin peso' ? ex.peso : ''].filter(Boolean).join('  ·  '), 0));
        } else {
          row(it.ejercicio, lineOf(it), 0);
        }
      });
      y += 10;
      if(H){ ctx.fillStyle = muted; ctx.font = fnt('400', 26); ctx.textAlign = 'center';
        ctx.fillText('russ.trainer  ·  ' + fecha + '  ·  válida por 24 h', W/2, y + 30); ctx.textAlign = 'left'; }
      return y + 70;
    }
    const probe = document.createElement('canvas'); probe.width = W; probe.height = 10;
    const H = draw(probe.getContext('2d'), 0);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    draw(cv.getContext('2d'), H);
    const jpg = atob(cv.toDataURL('image/jpeg', 0.92).split(',')[1]);
    const img = new Uint8Array(jpg.length); for(let i=0;i<jpg.length;i++) img[i] = jpg.charCodeAt(i);
    const pw = W * 0.5, ph = H * 0.5;
    const enc = new TextEncoder(); const chunks = []; const offs = []; let len = 0;
    const push = (u)=>{ chunks.push(u); len += u.length; };
    const txt = (t)=> push(enc.encode(t));
    const obj = (n, body)=>{ offs[n] = len; txt(n + ' 0 obj\n'); body(); txt('\nendobj\n'); };
    txt('%PDF-1.4\n');
    obj(1, ()=> txt('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, ()=> txt('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
    obj(3, ()=> txt('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));
    obj(4, ()=>{ txt('<< /Type /XObject /Subtype /Image /Width ' + W + ' /Height ' + H + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.length + ' >>\nstream\n'); push(img); txt('\nendstream'); });
    const cs = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
    obj(5, ()=> txt('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream'));
    const xr = len; txt('xref\n0 6\n0000000000 65535 f \n');
    for(let n=1;n<=5;n++) txt(String(offs[n]).padStart(10,'0') + ' 00000 n \n');
    txt('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
    const blob = new Blob(chunks, { type:'application/pdf' });
    const slug = String(state.routineDay).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Rutina-' + nombreBonito + '-' + slug + '.pdf';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    rtToast('Rutina descargada · la encuentras en Descargas');
  }catch(e){ console.error(e); rtToast('No se pudo descargar la rutina'); }
}
function msgReadKey(day, texto){
  let h = 5381; const t = String(texto || '');
  for(let i = 0; i < t.length; i++){ h = ((h << 5) + h + t.charCodeAt(i)) | 0; }
  return String(day) + '|' + (h >>> 0).toString(36);
}

async function _flushSave(){
  if(_saveBusy) return;
  _saveBusy = true;
  let keys;
  while((keys = Object.keys(_savePending)).length){
    const key = keys[0];
    const data = _savePending[key];
    delete _savePending[key];
    let ok = false;
    for(let attempt=0; attempt<4 && !ok; attempt++){
      try{
        await dbSet(key, data);
        ok = true;
      }catch(e){
        console.error('No se pudo guardar (intento ' + (attempt+1) + ')', e);
        if(attempt < 3) await new Promise(r=>setTimeout(r, 1000 * (attempt+1)));
      }
    }
    if(!ok){
      if(!(key in _savePending)) _savePending[key] = data;
      _saveFailed = true; showSaveBanner(true);
      break;
    }
    if(_saveFailed && !Object.keys(_savePending).length){ _saveFailed = false; showSaveBanner(false); }
  }
  _saveBusy = false;
  if(_saveFailed) setTimeout(_flushSave, 5000);
}

function localISO(d){

  return d.getFullYear() + '-' + m + '-' + day;
}

}

  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'short'});
}

const CQ_TIPOS = ['Programación','Ejercicio','Experiencia de clienta','Contenido','Idea para mis planes'];
let cq = { loaded:false, notas:[], tipo:'Programación', filtro:'Todas', draft:{ texto:'', para:'', aplicada:false, fecha:'' }, error:false };
let cqQueue = Promise.resolve();
async function cqFetch(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes?nombre=eq.${encodeURIComponent('_trainer_cuaderno')}&select=data`, {
    headers: await sbH()
  });
  if(!res.ok) throw new Error('http ' + res.status);
  const rows = await res.json();
  return (rows.length && rows[0].data && Array.isArray(rows[0].data.notas)) ? rows[0].data.notas : [];
}
async function cqPush(notas){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes`, {
    method: 'POST',
    headers: await sbH({ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' }),
    body: JSON.stringify({ nombre: '_trainer_cuaderno', data: { notas } })
  });
  if(!res.ok) throw new Error('http ' + res.status);
}
function cqBackup(){ try{ localStorage.setItem('rt_cuaderno_backup', JSON.stringify(cq.notas)); }catch(e){} }
async function cqLoad(){
  try{
    cq.notas = await cqFetch();
    cq.error = false;
  }catch(e){
    try{ cq.notas = JSON.parse(localStorage.getItem('rt_cuaderno_backup') || '[]'); }catch(_){ cq.notas = []; }
    cq.error = true;
  }
  cq.loaded = true;
  cqBackup();
  if(state.view === 'admin-cuaderno') render();
}
// Aplica el cambio al instante en pantalla y lo guarda en segundo plano (releyendo antes lo guardado, para no pisar notas de otro dispositivo)
function cqMutate(fn){
  cq.notas = fn(cq.notas.slice());
  cqBackup();
  render();
  cqQueue = cqQueue.then(async ()=>{
    for(let i=0;i<4;i++){
      try{
        const fresh = await cqFetch();
        const merged = fn(fresh);
        await cqPush(merged);
        cq.notas = merged; cqBackup();
        if(cq.error){ cq.error = false; if(state.view === 'admin-cuaderno') render(); }
        return;
      }catch(e){ await new Promise(r=>setTimeout(r, 800*(i+1))); }
    }
    cq.error = true;
    if(state.view === 'admin-cuaderno') render();
  });
}

  const $ = id=>document.getElementById(id);

    if(navigator.vibrate) navigator.vibrate(30);
    cqMutate(list=> list.some(n=>n.id===nota.id) ? list : list.concat([nota]));
    setTimeout(()=>{ const i = document.getElementById('cq-texto'); if(i) i.focus(); }, 50);
  };
  $('cq-save').onclick = save;
  $('cq-texto').onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); save(); } };
  app.querySelectorAll('[data-toggle]').forEach(b=> b.onclick = ()=>{
    const id = b.dataset.toggle; const cur = cq.notas.find(n=>n.id===id); const val = !(cur && cur.aplicada);

      restTimerEndTimes = {};
      state.uiResting = {};

    };

      btn.onclick = ()=> onToggleChecklist(btn.dataset.idx);
    });
    wrap.querySelectorAll('.tip-toggle').forEach(btn=>{
      btn.onclick = ()=>{ state.uiExpanded[`tip-${btn.dataset.tipidx}`] = true; render(); };
    });
    wrap.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.uiExpanded[btn.dataset.idx] = true; render(); };
    });
    wrap.querySelectorAll('.feeling-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.uiFeeling[btn.dataset.idx] = btn.dataset.feeling; render(); };
    });
    wrap.querySelectorAll('.rest-alert-dismiss').forEach(btn=>{
      btn.onclick = ()=>{ delete state.uiRestAlert[btn.dataset.idx]; render(); };
    });
    wrap.querySelectorAll('.rest-start-btn').forEach(btn=>{
      btn.onclick = ()=>{ delete state.uiRestAlert[btn.dataset.idx]; startRestTimer(btn.dataset.idx, Number(btn.dataset.seconds)); };
    });
    wrap.querySelectorAll('.rest-cancel-btn').forEach(btn=>{
      btn.onclick = ()=> cancelRestTimer(btn.dataset.idx);
    });
    wrap.querySelectorAll('[data-videotoggle]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.videotoggle;
        if(state.uiVideoOpen[key]) delete state.uiVideoOpen[key];
        else state.uiVideoOpen[key] = true;
        render();
      };
    });
    const finHoy = doneToday['fin'];
    if(!(finHoy && finHoy.done && finHoy.date === todayStr) && progressPct > 0 && progressPct < 100){
      const finCard = document.createElement('div');
      finCard.className = 'card';
      finCard.style.cssText = 'text-align:center; margin-top:22px;';
      finCard.innerHTML = `
        <p class="sub" style="margin:0 0 10px;">¿Hoy no pudiste hacerlo todo?<br>Cada paso cuenta 🤍</p>
        <button class="btn-ghost" id="finalizar-rutina-btn" style="width:100%; border:1.5px solid var(--rose-dark); color:var(--rose-dark); font-weight:700;">Finalizar rutina · ${progressPct}%</button>`;
      wrap.appendChild(finCard);
      finCard.querySelector('#finalizar-rutina-btn').onclick = ()=>{
        const ov = document.createElement('div');
        ov.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;';
        ov.innerHTML = `
          <div style="background:var(--bg); border-radius:18px; padding:22px; max-width:320px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.25);">
            <div style="font-size:30px;">💪</div>
            <div style="font-weight:700; font-size:16px; margin:6px 0;">¿Finalizar la rutina al ${progressPct}%?</div>
            <p class="sub" style="margin:0 0 14px;">Se guarda el día como hecho, con lo que entrenaste hoy.</p>
            <button class="btn-primary" id="fin-si">Sí, finalizar</button>
            <button class="btn-ghost" id="fin-no" style="margin-top:8px; width:100%;">Seguir entrenando</button>
          </div>`;
        document.body.appendChild(ov);
        ov.querySelector('#fin-no').onclick = ()=> ov.remove();
        ov.querySelector('#fin-si').onclick = ()=>{
          ov.remove();

          if(!state.data.completados[dayLabel]) state.data.completados[dayLabel] = {};
          state.data.completados[dayLabel]['fin'] = { done:true, date: todayISO(), ts:new Date().toISOString(), pct: progressPct };
          render();
          saveClienta(state.clienta, state.data);
        };
      };
    }
    wrap.querySelectorAll('.circuit-finish-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('¿Finalizar este circuito acá? Se va a marcar como hecho por hoy, aunque no hayas completado todas las rondas.')) return;
        const dayLabel = state.routineDay;
        if(!state.data.completados[dayLabel]) state.data.completados[dayLabel] = {};
        state.data.completados[dayLabel]['circuit-' + btn.dataset.idx] = { done:true, date: todayISO() };
        render();
        saveClienta(state.clienta, state.data);
      };
    });
    wrap.querySelectorAll('.circuit-round-minus').forEach(btn=>{
      btn.onclick = ()=>{
        const cs = state.uiCircuit[btn.dataset.cidx];
        cs.round = Math.max(1, cs.round - 1);
        render();
      };
    });
    wrap.querySelectorAll('.circuit-round-plus').forEach(btn=>{
      btn.onclick = ()=>{
        const cs = state.uiCircuit[btn.dataset.cidx];
        const item = items[Number(btn.dataset.cidx)];
        cs.round = Math.min(item.rondas, cs.round + 1);
        render();
      };
    });
    wrap.querySelectorAll('[data-circfeel]').forEach(btn=>{
      btn.onclick = ()=>{ state.uiFeeling[btn.dataset.circfeel] = btn.dataset.feeling; render(); };
    });
    wrap.querySelectorAll('.circuit-timer-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const cidx = btn.dataset.cidx;
        const exidx = btn.dataset.exidx;
        const key = 'circ-c' + cidx + '-' + exidx;
        const commentInput = document.getElementById('circ-comment-c' + cidx + '-' + exidx);
        const timerKey = 'circex-' + cidx + '-' + exidx;
        pendingCircuitEntries[timerKey] = {
          cidx, exidx,
          exercise: btn.dataset.exercise,
          reps: btn.dataset.reps,
          peso: btn.dataset.peso,
          comment: commentInput ? commentInput.value.trim() : '',
          feeling: state.uiFeeling[key] || ''
        };
        delete state.uiFeeling[key];
        startRestTimer(timerKey, Number(btn.dataset.seconds));
      };
    });
    wrap.querySelectorAll('.circuit-register-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(btn.dataset.busy) return;
        btn.dataset.busy = '1';
        const cidx = btn.dataset.cidx;
        const exidx = btn.dataset.exidx;
        const key = 'circ-c' + cidx + '-' + exidx;
        const exercise = btn.dataset.exercise;
        const round = state.uiCircuit[cidx].round;
        const commentInput = document.getElementById('circ-comment-c' + cidx + '-' + exidx);
        const comment = commentInput ? commentInput.value.trim() : '';
        if(!state.data.exercises[exercise]) state.data.exercises[exercise] = [];
        const entry = {
          date: todayISO(),
          ts: new Date().toISOString(),
          ronda: round,
          weight: btn.dataset.peso || '',
          reps: btn.dataset.reps,
          sets: 1,
          feeling: state.uiFeeling[key] || ''
        };
        if(comment) entry.comment = comment;
        state.data.exercises[exercise].push(entry);
        delete state.uiFeeling[key];
        saveClienta(state.clienta, state.data);
        const item = items[Number(cidx)];
        const isLastExercise = Number(exidx) === item.ejercicios.length - 1;
        if(isLastExercise && round < item.rondas && item.descansoRondas){
          startRestTimer('circuit-' + cidx, parseDescansoSeconds(item.descansoRondas));
        } else {
          render();
        }
      };
    });
    wrap.querySelectorAll('.same-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        if(btn.dataset.settarget !== '') state.uiSets[idx] = Number(btn.dataset.settarget);
        if(btn.dataset.defaultweight !== ''){
          state.uiWeightPrefill[idx] = Number(btn.dataset.defaultweight);
        }
        persistUiProgress();
        render();
      };
    });
    wrap.querySelectorAll('.set-plus').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
        state.uiSets[idx] = current + 1;
        persistUiProgress();
        render();
      };
    });
    wrap.querySelectorAll('.set-minus').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
        state.uiSets[idx] = Math.max(0, current - 1);
        persistUiProgress();
        render();
      };
    });
    wrap.querySelectorAll('.registrar-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const sinPeso = btn.dataset.sinpeso === '1';
        const weightInput = document.getElementById(`reg-weight-${idx}`);
        const err = document.getElementById(`reg-error-${idx}`);
        if(!sinPeso && (!weightInput || weightInput.value === '')){
          err.classList.remove('hidden');
          return;
        }
        let weight = sinPeso ? '' : weightInput.value;
        const weight2Input = document.getElementById(`reg-weight2-${idx}`);
        if(!sinPeso && weight2Input){
          if(weight2Input.value === ''){ err.classList.remove('hidden'); return; }
          weight = weightInput.value.trim() + ' y ' + weight2Input.value.trim();
        }
        const feeling = state.uiFeeling[idx] || '';
        const commentInput = document.getElementById(`reg-comment-${idx}`);
        const comment = commentInput ? commentInput.value.trim() : '';
        onQuickSave(idx, btn.dataset.exercise, weight, btn.dataset.reps, btn.dataset.sets, feeling, comment);
      };
    });
  }
  try{
    if(state.clienta){
      if(state.view === 'routine-day' && state.routineDay) localStorage.setItem('rt_view_' + state.clienta, JSON.stringify({ date: todayISO(), day: state.routineDay }));
      else if(state.view === 'dashboard') localStorage.removeItem('rt_view_' + state.clienta);
    }
  }catch(e){}
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function onGenerateReport(key){
  const c = state.adminData[key];
  const streak = computeStreak(c.data);
  const weekCount = computeWeekCount(c.data);
  const target = weeklyTarget(c.displayName);
  const comments = [];
  Object.keys(c.data.exercises).forEach(ex=>{
    c.data.exercises[ex].forEach(e=>{
      const d = daysSince(e.date);
      if(e.comment && d !== null && d <= 7) comments.push(`- ${ex}: "${e.comment}"`);
    });
  });
  let text = `Resumen semanal de ${c.displayName}\n`;
  text += `Días entrenados esta semana: ${weekCount}/${target}\n`;
  text += `Racha actual: ${streak} día${streak===1?'':'s'}\n`;
  if(comments.length){
    text += `\nComentarios de la semana:\n` + comments.join('\n');
  }
  const output = document.getElementById('report-output');
  output.value = text;
  output.classList.remove('hidden');
  output.focus();
  output.select();
}

async function onEnter(){
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  const clave = (document.getElementById('pass-input') || {}).value || '';
  const err = document.getElementById('login-error');
  if(!name || !clave){
    err.textContent = 'Escribe tu nombre y tu clave para continuar.';
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  const btn = document.getElementById('enter-btn'); if(btn){ btn.disabled = true; btn.textContent = 'Entrando…'; }
  try{
    await authLogin(name, clave);
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Entrar'; }
    err.textContent = (e && e.status) ? 'El nombre o la clave no son correctos. Revisa e intenta de nuevo.' : '⚠️ No se pudo conectar. Revisa tu internet e intenta de nuevo.';
    err.classList.remove('hidden');
    return;
  }
  if(name.toLowerCase() === 'panelruss'){
    localStorage.setItem('rt_session', 'panelruss');
    const now = new Date();
    state.calendarYear = now.getFullYear();
    state.calendarMonth = now.getMonth();
    state.calendarSelectedDate = todayISO();
    state.view = 'admin-list';
    render();
    loadAdminData();
    loadTrainerEvents().then(events=>{ state.trainerEvents = events;  });
    return;
  }
  localStorage.setItem('rt_session', name);
  state.clienta = name;
  try{
    state.data = await loadClienta(name);
  }catch(e){
    err.textContent = '⚠️ No se pudo conectar con la base de datos. Revisa tu conexión a internet y vuelve a intentar — tu información no se perdió.';
    err.classList.remove('hidden');
    state.clienta = null;
    return;
  }
  restoreUiProgress();
  state.view = 'dashboard';
  try{
    const v = JSON.parse(localStorage.getItem('rt_view_' + state.clienta) || 'null');
    const rt = ROUTINES[routineKey(state.clienta)];
    if(v && v.date === todayISO() && v.day && state.view === 'dashboard' && rt && rt[v.day]){
      state.view = 'routine-day';
      state.routineDay = v.day;
    }
  }catch(e){}
  render();
}

async function onSaveEntry(){

  const weight = document.getElementById('f-weight').value;
  const reps = document.getElementById('f-reps').value;
  const sets = document.getElementById('f-sets').value;

  });

const _quickSaving = {};
async function onQuickSave(idx, exerciseName, weight, reps, sets, feeling, comment){
  if(_quickSaving[idx]) return;
  _quickSaving[idx] = true;
  setTimeout(()=>{ delete _quickSaving[idx]; }, 1500);
  if(restTimerHandles[idx]){ clearInterval(restTimerHandles[idx]); delete restTimerHandles[idx]; delete restTimerEndTimes[idx]; delete state.uiResting[idx]; }
  delete state.uiRestAlert[idx];
  if(!state.data.exercises[exerciseName]){
    state.data.exercises[exerciseName] = [];
  }
  const entry = {
    date: todayISO(),
    ts: new Date().toISOString(),
    weight: weight,
    reps: reps === '' ? 0 : Number(reps),
    sets: sets === '' ? 0 : Number(sets)
  };
  if(feeling) entry.feeling = feeling;
  if(comment) entry.comment = comment;
  state.data.exercises[exerciseName].push(entry);
  state.data.exercises[exerciseName].sort((a,b)=> a.date.localeCompare(b.date));
  delete state.uiExpanded[idx];
  delete state.uiFeeling[idx];
  delete state.uiSets[idx];
  delete state.uiWeightPrefill[idx];
  persistUiProgress();
  render();
  saveClienta(state.clienta, state.data);
}

async function onToggleChecklist(idx){
  const day = state.routineDay;
  if(!state.data.completados[day]) state.data.completados[day] = {};
  const current = state.data.completados[day][idx];
  const isDone = current && current.done;
  state.data.completados[day][idx] = isDone ? { done:false } : { done:true, date: todayISO(), ts: new Date().toISOString() };
  render();
  saveClienta(state.clienta, state.data);
}

function drawChart(entries){
  const ctx = document.getElementById('progress-chart');
  if(chartInstance){ chartInstance.destroy(); }
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: entries.map(e=>formatDate(e.date)),
      datasets: [{
        label: 'Peso (kg)',
        data: entries.map(e=>parseDefaultWeight(e.weight)),
        borderColor: '#d4848f',
        backgroundColor: 'rgba(212,132,143,0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#d4848f'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8a8078' }, grid: { color: 'rgba(43,37,33,0.07)' } },
        y: { ticks: { color: '#8a8078' }, grid: { color: 'rgba(43,37,33,0.07)' } }
      }
    }
  });
}

async function restoreSession(){
  const saved = localStorage.getItem('rt_session');
  if(!saved) return;
  if(!authGet()){ rtClearSession(); state.view = 'login'; render(); return; }
  await authEnsure(true);
  if(!authGet() && navigator.onLine !== false){ rtClearSession(); state.view = 'login'; render(); return; }
  if(saved === 'panelruss'){
    const now = new Date();
    state.calendarYear = now.getFullYear();
    state.calendarMonth = now.getMonth();
    state.calendarSelectedDate = todayISO();
    state.view = 'admin-list';
    render();
    loadAdminData();
    loadTrainerEvents().then(events=>{ state.trainerEvents = events;  });
    return;
  }
  state.clienta = saved;
  try{
    state.data = await loadClienta(saved);
  }catch(e){
    state.clienta = null;
    state.view = 'session-error';
    render();
    return;
  }
  restoreUiProgress();
  state.view = 'dashboard';
  try{
    const v = JSON.parse(localStorage.getItem('rt_view_' + state.clienta) || 'null');
    const rt = ROUTINES[routineKey(state.clienta)];
    if(v && v.date === todayISO() && v.day && state.view === 'dashboard' && rt && rt[v.day]){
      state.view = 'routine-day';
      state.routineDay = v.day;
    }
  }catch(e){}
  render();

function decodePlantilla(){
  const bin = atob(PLANTILLA_B64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
