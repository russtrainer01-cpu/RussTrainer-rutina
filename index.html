<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progreso · russ.trainer</title>
<style>
  :root{
    --bg:#FCFCF7;
    --bg-card:#F5F2E9;
    --bg-elevated:#EFEBDD;
    --rose:#d4848f;
    --rose-dark:#a85c68;
    --text:#2b2521;
    --text-muted:#8a8078;
    --border:rgba(43,37,33,0.1);
    --danger:#b85c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:440px;
    padding:32px 20px 90px;
  }
  .brand{
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--rose);
    text-transform:lowercase;
    margin-bottom:4px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    margin:0 0 24px;
    letter-spacing:-0.01em;
  }
  h2{
    font-size:18px;
    font-weight:700;
    margin:0 0 16px;
  }
  p.sub{
    color:var(--text-muted);
    font-size:14px;
    margin:-16px 0 24px;
    line-height:1.5;
  }
  input, select{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    font-size:15px;
    padding:12px 14px;
    border-radius:6px;
    margin-bottom:12px;

  input:focus, select:focus{

    font-size:13px;

    margin-bottom:6px;

  button{
    font-family:inherit;

    padding:13px 20px;
    cursor:pointer;
  }
  .btn-primary{

    width:100%;
  }
  .btn-primary:active{background:var(--rose-dark);}
  .btn-ghost{

    color:var(--text-muted);
    border:1px solid var(--border);
  }
  .btn-ghost:active{background:var(--bg-elevated);}

    font-weight:600;

  }
  .chip-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
  }
  .chip{
    background:var(--bg-elevated);

    color:var(--text);
    padding:10px 16px;
    border-radius:20px;
    font-size:14px;
    cursor:pointer;
  }
  .chip:active{border-color:var(--rose);}
  .chip-add{
    color:var(--rose);

  }
  .empty{

    line-height:1.6;

  .back{
    display:flex;
    align-items:center;
    gap:6px;

  #chart-wrap{

  .entry-row:last-child{border-bottom:none;}

  .tip{

  .login-card{

  }
  .tagline{

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let audioCtx = null;
function ensureAudioContext(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  return audioCtx;
}
function playTickSound(){
  try{
    const ctx = ensureAudioContext();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1000;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
    gain.gain.linearRampToValueAtTime(0, now + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }catch(e){}
}

function parseDefaultWeight(pesoStr){
  if(!pesoStr) return null;
  const m = String(pesoStr).match(/(\d+(\.\d+)?)/);
  if(!m) return null;
  return parseFloat(m[1]);
}

function parseDescansoSeconds(str){
  if(!str) return 60;
  const m = String(str).match(/(\d+(\.\d+)?)/);
  if(!m) return 60;
  const num = parseFloat(m[1]);
  if(/min/i.test(str)) return Math.round(num*60);
  return Math.round(num);
}
function formatMMSS(s){
  const mi = Math.floor(s/60);
  const se = s % 60;
  return `${mi}:${String(se).padStart(2,'0')}`;
}
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){
    try{ wakeLock.release(); }catch(e){}
    wakeLock = null;
  }
}

let restTimerHandles = {};
let restTimerEndTimes = {};
function startRestTimer(idx, seconds){
  ensureAudioContext();
  requestWakeLock();
  const current = state.uiSets[idx] !== undefined ? state.uiSets[idx] : 0;
  state.uiSets[idx] = current + 1;
  if(restTimerHandles[idx]) clearInterval(restTimerHandles[idx]);
  restTimerEndTimes[idx] = Date.now() + seconds*1000;
  state.uiResting[idx] = seconds;
  render();
  restTimerHandles[idx] = setInterval(()=> tickRestTimer(idx), 1000);
}
function tickRestTimer(idx){
  if(restTimerEndTimes[idx] === undefined) return;
  const remaining = Math.max(0, Math.round((restTimerEndTimes[idx] - Date.now()) / 1000));
  state.uiResting[idx] = remaining;
  const lbl = document.getElementById(`rest-timer-${idx}`);
  if(lbl) lbl.textContent = formatMMSS(remaining);
  const overlayTime = document.getElementById('rest-overlay-time');
  if(overlayTime) overlayTime.textContent = formatMMSS(remaining);
  const overlay = document.getElementById('rest-overlay');
  if(overlay) overlay.classList.toggle('blinking', remaining <= 10);
  if(remaining > 0 && remaining <= 10) playTickSound();
  if(remaining <= 0){
    clearInterval(restTimerHandles[idx]);
    delete restTimerHandles[idx];
    delete restTimerEndTimes[idx];
    delete state.uiResting[idx];
    onRestFinished(idx);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    Object.keys(restTimerHandles).forEach(idx => tickRestTimer(idx));
  }
});
function cancelRestTimer(idx){
  if(restTimerHandles[idx]) clearInterval(restTimerHandles[idx]);
  delete restTimerHandles[idx];
  delete restTimerEndTimes[idx];
  delete state.uiResting[idx];
  releaseWakeLock();
  render();
}
let pendingCircuitEntries = {};
function onRestFinished(idx){
  releaseWakeLock();
  try{
    const ctx = ensureAudioContext();
    if(ctx){
      const playTone = (freq, startTime, duration)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.4, startTime + 0.04);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      };
      const now = ctx.currentTime;
      playTone(659.25, now, 0.3);
      playTone(880, now + 0.2, 0.3);
      playTone(1174.66, now + 0.4, 0.5);
      playTone(880, now + 0.7, 0.3);
      playTone(1174.66, now + 0.9, 0.6);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([250,100,250,100,250]);
  if(String(idx).indexOf('circex-') === 0){
    const pending = pendingCircuitEntries[idx];
    if(pending){
      const exercise = pending.exercise;
      if(!state.data.exercises[exercise]) state.data.exercises[exercise] = [];
      const entry = {
        date: todayISO(),
        ts: new Date().toISOString(),
        ronda: state.uiCircuit[pending.cidx] ? state.uiCircuit[pending.cidx].round : 1,
        weight: pending.peso || '',
        reps: pending.reps,
        sets: 1,
        feeling: pending.feeling || ''
      };
      if(pending.comment) entry.comment = pending.comment;
      state.data.exercises[exercise].push(entry);
      delete pendingCircuitEntries[idx];
      saveClienta(state.clienta, state.data);
    }
    render();
    return;
  }
  state.uiRestAlert[idx] = true;
  setTimeout(()=>{
    if(state.uiRestAlert[idx]){
      delete state.uiRestAlert[idx];
      render();
    }
  }, 6000);
  render();
}

function firstNumber(str){
  const m = String(str).match(/\d+/);
  return m ? Number(m[0]) : null;
}
function isTimeBased(str){
  return /seg|min/i.test(String(str));
}
function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const shortsMatch = url.match(/\/shorts\/([^?&]+)/);
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortLinkMatch = url.match(/youtu\.be\/([^?&]+)/);
  if(shortsMatch) id = shortsMatch[1];
  else if(watchMatch) id = watchMatch[1];
  else if(shortLinkMatch) id = shortLinkMatch[1];
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

function getCalendarEventsForMonth(year, month){
  const map = {};
  function addEvent(dateStr, ev){
    if(!map[dateStr]) map[dateStr] = [];
    map[dateStr].push(ev);
  }
  const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
  Object.keys(state.adminData || {}).forEach(key=>{
    const c = state.adminData[key];
    const f = c.data.ficha;
    if(f.cumpleanos && /^\d{2}-\d{2}$/.test(f.cumpleanos)){
      const mm = String(month+1).padStart(2,'0');
      if(f.cumpleanos.slice(0,2) === mm){
        const dd = f.cumpleanos.slice(3,5);
        addEvent(`${year}-${mm}-${dd}`, { type:'cumple', icon:'🎂', label: c.displayName, color:'#c9974a', key });
      }
    }
    if(c.data.vencimiento && c.data.vencimiento.slice(0,7) === monthStr){
      addEvent(c.data.vencimiento, { type:'vencimiento', icon:'💳', label: c.displayName, color:'#c65f5f', key });
    }
    const wi = weekEndInfo(f.semanaInicio);
    if(wi && wi.endStr.slice(0,7) === monthStr){
      addEvent(wi.endStr, { type:'semana', icon:'📅', label: c.displayName, color:'#d4848f', key });
    }
  });
  const todayStr = todayISO();
  if(todayStr.slice(0,7) === monthStr && state.adminData){
    const feed = buildActivityFeed(state.adminData).filter(i=>i.comment && !i.respondido);
    const byClient = {};
    feed.forEach(i=>{ byClient[i.key] = (byClient[i.key]||0) + 1; });
    Object.keys(byClient).forEach(key=>{
      const c = state.adminData[key];
      addEvent(todayStr, { type:'comentario', icon:'💬', label: c.displayName + ' (' + byClient[key] + ')', color:'#4a90b8', key });
    });
  }
  (state.trainerEvents || []).forEach(ev=>{
    if(ev.date.slice(0,7) === monthStr){
      addEvent(ev.date, { type:'custom', icon:'📌', label: ev.text, color:'#6fa86f' });
    }
  });
  return map;
}

function routineKey(name){ return name.trim().toLowerCase(); }

function parseDayLabel(label){
  const m = label.match(/^Semana (\d+) - (.+)$/);
  if(m) return { semana: parseInt(m[1]), dayName: m[2] };
  return { semana: null, dayName: label };
}
function getMaxSemana(routine){
  let max = null;
  Object.keys(routine).forEach(label=>{
    const p = parseDayLabel(label);
    if(p.semana !== null) max = max === null ? p.semana : Math.max(max, p.semana);
  });
  return max;
}
function groupDaysBySemana(routine){
  const groups = {};
  const noSemana = [];
  Object.keys(routine).forEach(label=>{
    const p = parseDayLabel(label);
    if(p.semana === null){ noSemana.push(label); return; }
    if(!groups[p.semana]) groups[p.semana] = [];
    groups[p.semana].push(label);
  });
  return { groups, noSemana };
}

function isDayCompleteOn(data, dayLabel, items, dateStr){
  return items.every((item, idx)=>{
    if(item.tipo === 'mensaje') return true;
    if(item.tipo === 'checklist'){
      const c = data.completados[dayLabel] && data.completados[dayLabel][idx];
      return !!(c && c.done && c.date === dateStr);
    }
    if(item.tipo === 'circuito'){
      return item.ejercicios.every(ex=>{
        const entries = (data.exercises[ex.ejercicio] || []).filter(e=> e.date === dateStr);
        return entries.length >= item.rondas;
      });
    }
    const entries = data.exercises[item.ejercicio] || [];
    return entries.some(e=> e.date === dateStr);
  });
}

function lastCompletionDate(data, dayLabel, items){
  const cursor = new Date();
  for(let i=0;i<30;i++){
    const ds = cursor.toISOString().slice(0,10);
    if(isDayCompleteOn(data, dayLabel, items, ds)) return ds;
    cursor.setDate(cursor.getDate()-1);
  }
  return null;
}

function lastActivityDate(data){
  const dates = getActivityDates(data);
  if(dates.size === 0) return null;
  return Array.from(dates).sort().pop();
}

function daysSince(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((now - then) / 86400000);
}

function computeMonthNumber(fechaInicio){
  if(!fechaInicio) return null;
  const start = new Date(fechaInicio + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  const days = Math.floor((now - start) / 86400000);
  if(days < 0) return null;
  return Math.floor(days / 30) + 1;
}
const MONTH_COLORS = ['#d4848f', '#4a90b8', '#6fa86f', '#c9974a', '#9b7bc9', '#c96f8f', '#5aa8a0'];
function monthColor(monthNum){
  return MONTH_COLORS[(monthNum - 1) % MONTH_COLORS.length];
}

function weekEndInfo(semanaInicio){
  if(!semanaInicio) return null;
  const start = new Date(semanaInicio + 'T00:00:00');
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  const endStr = end.toISOString().slice(0,10);
  const daysLeft = daysUntil(endStr);
  return { endStr, daysLeft };
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}

function isBirthdayToday(mmdd){
  if(!mmdd) return false;
  const today = new Date();
  const todayMMDD = String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  return mmdd === todayMMDD;
}

function buildActivityFeed(adminData){
  const items = [];
  Object.keys(adminData).forEach(key=>{
    const c = adminData[key];
    Object.keys(c.data.exercises).forEach(ex=>{
      c.data.exercises[ex].forEach(e=>{
        items.push({
          key: key,
          clienta: c.displayName,
          type: 'exercise',
          exercise: ex,
          date: e.date,
          ts: e.ts || e.date,
          weight: e.weight,
          reps: e.reps,
          sets: e.sets,
          feeling: e.feeling,
          respondido: !!e.respondido,
          comment: e.comment
        });
      });
    });
    const routine = ROUTINES[key] || {};
    Object.keys(c.data.completados || {}).forEach(day=>{
      const dayItems = routine[day] || [];
      Object.keys(c.data.completados[day]).forEach(idx=>{
        const rec = c.data.completados[day][idx];
        if(rec && rec.done){
          const item = dayItems[Number(idx)];
          items.push({
            clienta: c.displayName,
            type: 'checklist',
            exercise: item ? item.ejercicio : 'Ejercicio',
            date: rec.date,
            ts: rec.ts || rec.date
          });
        }
      });
    });
  });
  items.sort((a,b)=> String(b.ts).localeCompare(String(a.ts)));
  return items;
}

async function markCommentResponded(key, exercise, ts){
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  const arr = fresh.exercises[exercise] || [];
  const entry = arr.find(e => (e.ts || e.date) === ts);
  if(entry) entry.respondido = true;
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
  render();
}

async function loadTrainerEvents(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes?nombre=eq.${encodeURIComponent('_trainer_events')}&select=data`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if(rows.length && rows[0].data && Array.isArray(rows[0].data.events)) return rows[0].data.events;
    return [];
  }catch(e){ return []; }
}
async function saveTrainerEvents(events){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/clientes`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
      body: JSON.stringify({ nombre: '_trainer_events', data: { events } })
    });
  }catch(e){}
}

async function loadAdminData(){
  state.adminData = {};
  for(const key of Object.keys(ROUTINES)){
    const displayName = key.charAt(0).toUpperCase() + key.slice(1);
    const data = await loadClienta(displayName);
    state.adminData[key] = { displayName, data };
  }
  render();
}

function weeklyTarget(name){
  const cfg = CLIENT_CONFIG[routineKey(name)];
  return cfg && cfg.diasPorSemana ? cfg.diasPorSemana : 7;
}
function isMasculino(name){
  const cfg = CLIENT_CONFIG[routineKey(name)];
  return cfg && cfg.genero === 'masculino';
}

function getActivityDates(data){
  const dates = new Set();
  Object.values(data.exercises || {}).forEach(entries=>{
    entries.forEach(e=> dates.add(e.date));
  });
  Object.values(data.completados || {}).forEach(dayObj=>{
    Object.values(dayObj).forEach(v=>{
      if(v && v.done && v.date) dates.add(v.date);
    });
  });
  return dates;
}

function computeStreak(data){
  const dates = getActivityDates(data);
  if(dates.size === 0) return 0;
  const iso = d => d.toISOString().slice(0,10);
  let cursor = new Date();
  if(!dates.has(iso(cursor))){
    cursor.setDate(cursor.getDate()-1);
  }
  let streak = 0;
  while(dates.has(iso(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeWeekCount(data){
  const dates = getActivityDates(data);
  let count = 0;
  const cursor = new Date();
  for(let i=0;i<7;i++){
    if(dates.has(cursor.toISOString().slice(0,10))) count++;
    cursor.setDate(cursor.getDate()-1);
  }
  return count;
}

const SUPABASE_KEY = 'sb_publishable_IKFhc2x6r1AdB0IS8b4Nlw_TwowDq34';

async function dbGet(nombre){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes?nombre=eq.${encodeURIComponent(nombre)}&select=data`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if(!res.ok) throw new Error('No se pudo leer de la base');
  const rows = await res.json();
  return rows.length ? rows[0].data : null;
}

async function dbSet(nombre, data){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/clientes`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates'
    },
    body: JSON.stringify({ nombre, data })
  });
  if(!res.ok) throw new Error('No se pudo guardar en la base');
}

async function loadClienta(name){
  try{
    const parsed = (await dbGet(storageKey(name))) || { exercises: {} };
    if(!parsed.completados) parsed.completados = {};
    if(!parsed.bodyWeight) parsed.bodyWeight = [];
    if(!parsed.weightPromptSeen) parsed.weightPromptSeen = false;
    if(!parsed.ficha) parsed.ficha = { objetivo:'', nivel:'', restricciones:'', fechaInicio:'', cumpleanos:'', semanaInicio:'', telefono:'' };
    if(parsed.ficha.semanaInicio === undefined) parsed.ficha.semanaInicio = '';
    if(parsed.ficha.telefono === undefined) parsed.ficha.telefono = '';
    if(!parsed.vencimiento) parsed.vencimiento = '';
    if(!parsed.trainerNotes) parsed.trainerNotes = [];
    if(!parsed.nextWeekNotes) parsed.nextWeekNotes = {};
    return parsed;
  }catch(e){
    return { exercises: {}, completados: {}, bodyWeight: [], weightPromptSeen: false, ficha:{ objetivo:'', nivel:'', restricciones:'', fechaInicio:'', cumpleanos:'', semanaInicio:'' }, vencimiento:'', trainerNotes: [], nextWeekNotes: {} };
  }
}
async function saveClienta(name, data){
  try{
    await dbSet(storageKey(name), data);
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function formatDate(iso){

}

        const err = document.getElementById(`reg-error-${idx}`);
        if(!sinPeso && (!weightInput || weightInput.value === '')){
          err.classList.remove('hidden');
          return;
        }
        const weight = sinPeso ? 0 : Number(weightInput.value);
        const feeling = state.uiFeeling[idx] || '';
        const commentInput = document.getElementById(`reg-comment-${idx}`);
        const comment = commentInput ? commentInput.value.trim() : '';
        onQuickSave(idx, btn.dataset.exercise, weight, btn.dataset.reps, btn.dataset.sets, feeling, comment);
      };
    });
  }
  const bottomTab = document.getElementById('bottom-tab');
  const showTab = state.clienta && !['login','welcome'].includes(state.view);
  bottomTab.classList.toggle('hidden', !showTab);
  document.getElementById('weight-tab-btn').onclick = ()=>{ state.view = 'weight'; render(); };
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function onSaveInitialWeight(){
  const input = document.getElementById('w-weight');
  const weight = input.value;
  if(weight === ''){
    await onSkipInitialWeight();
    return;
  }
  state.data.bodyWeight.push({ date: todayISO(), weight: Number(weight) });
  state.data.weightPromptSeen = true;
  await saveClienta(state.clienta, state.data);
  state.view = 'dashboard';
  render();
}

async function onSkipInitialWeight(){
  state.data.weightPromptSeen = true;
  await saveClienta(state.clienta, state.data);
  state.view = 'dashboard';
  render();
}

async function onUpdateWeight(){
  const input = document.getElementById('update-weight-input');
  const err = document.getElementById('update-weight-error');
  const weight = input.value;
  if(weight === ''){
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  state.data.bodyWeight.push({ date: todayISO(), weight: Number(weight) });
  await saveClienta(state.clienta, state.data);
  state.showWeightForm = false;
  render();
}

async function onSaveFicha(key){
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  fresh.ficha = {
    objetivo: document.getElementById('f-objetivo').value.trim(),
    nivel: document.getElementById('f-nivel').value.trim(),
    restricciones: document.getElementById('f-restricciones').value.trim(),
    telefono: document.getElementById('f-telefono').value.trim(),
    fechaInicio: document.getElementById('f-fechainicio').value,
    cumpleanos: document.getElementById('f-cumple').value.trim(),
    semanaInicio: document.getElementById('f-semanainicio').value
  };
  fresh.vencimiento = document.getElementById('f-vencimiento').value;
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
  render();
}

async function onSaveNextWeekNote(key, exerciseName, text){
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  if(!fresh.nextWeekNotes) fresh.nextWeekNotes = {};
  if(text) fresh.nextWeekNotes[exerciseName] = text;
  else delete fresh.nextWeekNotes[exerciseName];
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
}

async function onAddNote(key){
  const input = document.getElementById('note-input');
  const text = input.value.trim();
  if(!text) return;
  const c = state.adminData[key];
  const fresh = await loadClienta(c.displayName);
  fresh.trainerNotes.push({ date: todayISO(), text });
  await saveClienta(c.displayName, fresh);
  c.data = fresh;
  render();
}

function onGenerateReport(key){
  const c = state.adminData[key];
  const streak = computeStreak(c.data);
  const weekCount = computeWeekCount(c.data);
  const target = weeklyTarget(c.displayName);
  const comments = [];
  Object.keys(c.data.exercises).forEach(ex=>{
    c.data.exercises[ex].forEach(e=>{
      const d = daysSince(e.date);
      if(e.comment && d !== null && d <= 7) comments.push(`- ${ex}: "${e.comment}"`);
    });
  });
  let text = `Resumen semanal de ${c.displayName}\n`;
  text += `Días entrenados esta semana: ${weekCount}/${target}\n`;
  text += `Racha actual: ${streak} día${streak===1?'':'s'}\n`;
  if(comments.length){
    text += `\nComentarios de la semana:\n` + comments.join('\n');
  }
  const output = document.getElementById('report-output');
  output.value = text;
  output.classList.remove('hidden');
  output.focus();
  output.select();
}

async function onEnter(){
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  const err = document.getElementById('login-error');
  if(!name){
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  if(name.toLowerCase() === 'panelruss'){
    localStorage.setItem('rt_session', 'panelruss');
    const now = new Date();
    state.calendarYear = now.getFullYear();
    state.calendarMonth = now.getMonth();
    state.calendarSelectedDate = todayISO();
    state.view = 'admin-calendar';
    render();
    loadAdminData();
    loadTrainerEvents().then(events=>{ state.trainerEvents = events; if(state.view==='admin-calendar') render(); });
    return;
  }
  localStorage.setItem('rt_session', name);
  state.clienta = name;
  state.data = await loadClienta(name);
  state.view = state.data.weightPromptSeen ? 'dashboard' : 'welcome';
  render();
}

async function onAddExercise(){
  const exerciseSelect = document.getElementById('exercise-select');
  const name = exerciseSelect.value;
  if(!name) return;
  if(!state.data.exercises[name]){
    state.data.exercises[name] = [];
    await saveClienta(state.clienta, state.data);
  }
  render();
}

async function onSaveEntry(){
  const date = document.getElementById('f-date').value;
  const weight = document.getElementById('f-weight').value;
  const reps = document.getElementById('f-reps').value;
  const sets = document.getElementById('f-sets').value;
  const err = document.getElementById('form-error');
  if(!date || weight === '' || reps === '' || sets === ''){
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  state.data.exercises[state.exercise].push({
    date,
    weight: weight,
    reps: Number(reps),
    sets: Number(sets)
  });
  state.data.exercises[state.exercise].sort((a,b)=> a.date.localeCompare(b.date));
  await saveClienta(state.clienta, state.data);
  render();
}

async function onQuickSave(idx, exerciseName, weight, reps, sets, feeling, comment){
  if(restTimerHandles[idx]){ clearInterval(restTimerHandles[idx]); delete restTimerHandles[idx]; delete restTimerEndTimes[idx]; delete state.uiResting[idx]; }
  delete state.uiRestAlert[idx];
  if(!state.data.exercises[exerciseName]){
    state.data.exercises[exerciseName] = [];
  }
  const entry = {
    date: todayISO(),
    ts: new Date().toISOString(),
    weight: weight,
    reps: reps === '' ? 0 : Number(reps),
    sets: sets === '' ? 0 : Number(sets)
  };
  if(feeling) entry.feeling = feeling;
  if(comment) entry.comment = comment;
  state.data.exercises[exerciseName].push(entry);
  state.data.exercises[exerciseName].sort((a,b)=> a.date.localeCompare(b.date));
  await saveClienta(state.clienta, state.data);
  delete state.uiExpanded[idx];
  delete state.uiFeeling[idx];
  delete state.uiSets[idx];
  delete state.uiWeightPrefill[idx];
  render();
}

async function onToggleChecklist(idx){
  const day = state.routineDay;
  if(!state.data.completados[day]) state.data.completados[day] = {};
  const current = state.data.completados[day][idx];
  const isDone = current && current.done;
  state.data.completados[day][idx] = isDone ? { done:false } : { done:true, date: todayISO(), ts: new Date().toISOString() };
  await saveClienta(state.clienta, state.data);
  render();
}

function drawChart(entries){
  const ctx = document.getElementById('progress-chart');
  if(chartInstance){ chartInstance.destroy(); }
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: entries.map(e=>formatDate(e.date)),
      datasets: [{
        label: 'Peso (kg)',
        data: entries.map(e=>parseDefaultWeight(e.weight)),
        borderColor: '#d4848f',
        backgroundColor: 'rgba(212,132,143,0.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#d4848f'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8a8078' }, grid: { color: 'rgba(43,37,33,0.07)' } },
        y: { ticks: { color: '#8a8078' }, grid: { color: 'rgba(43,37,33,0.07)' } }
      }
    }
  });
}

async function restoreSession(){
  const saved = localStorage.getItem('rt_session');
  if(!saved) return;
  if(saved === 'panelruss'){
    const now = new Date();
    state.calendarYear = now.getFullYear();
    state.calendarMonth = now.getMonth();
    state.calendarSelectedDate = todayISO();
    state.view = 'admin-calendar';
    render();
    loadAdminData();
    loadTrainerEvents().then(events=>{ state.trainerEvents = events; if(state.view==='admin-calendar') render(); });
    return;
  }
  state.clienta = saved;
  state.data = await loadClienta(saved);
  state.view = state.data.weightPromptSeen ? 'dashboard' : 'welcome';
  render();
}

render();
restoreSession();
</script>
